    /* ============================================================================
     * 2. ALMACENAMIENTO PERMANENTE EN DISPOSITIVO (IndexedDB) + DESCARGA HTML
     * Conserva tus datos en el iPhone entre sesiones y actualizaciones sin
     * depender de Safari abierto ni de localStorage.
     * ========================================================================== */
    const IDB_NAME = 'HybridOS_Permanent_Store';
    const IDB_STORE = 'profile_store';
    const IDB_KEY = 'hybridos_v3';

    const readEmbeddedState = () => {
      try {
        const el = document.getElementById('initial-embedded-state');
        if (!el || !el.textContent) return null;
        const parsed = JSON.parse(el.textContent);
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch (e) {
        return null;
      }
    };

    const idbReadState = () =>
      new Promise((resolve) => {
        try {
          if (typeof window === 'undefined' || !window.indexedDB) return resolve(null);
          const req = window.indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => {
            const dbInst = req.result;
            if (!dbInst.objectStoreNames.contains(IDB_STORE)) {
              dbInst.createObjectStore(IDB_STORE);
            }
          };
          req.onsuccess = () => {
            try {
              const dbInst = req.result;
              const tx = dbInst.transaction(IDB_STORE, 'readonly');
              const getReq = tx.objectStore(IDB_STORE).get(IDB_KEY);
              getReq.onsuccess = () => resolve(getReq.result || null);
              getReq.onerror = () => resolve(null);
            } catch (err) {
              resolve(null);
            }
          };
          req.onerror = () => resolve(null);
        } catch (err) {
          resolve(null);
        }
      });

    const idbWriteState = (stateObj) =>
      new Promise((resolve) => {
        try {
          if (typeof window === 'undefined' || !window.indexedDB) return resolve(false);
          const req = window.indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => {
            const dbInst = req.result;
            if (!dbInst.objectStoreNames.contains(IDB_STORE)) {
              dbInst.createObjectStore(IDB_STORE);
            }
          };
          req.onsuccess = () => {
            try {
              const dbInst = req.result;
              const tx = dbInst.transaction(IDB_STORE, 'readwrite');
              tx.objectStore(IDB_STORE).put(stateObj, IDB_KEY);
              tx.oncomplete = () => resolve(true);
              tx.onerror = () => resolve(false);
            } catch (err) {
              resolve(false);
            }
          };
          req.onerror = () => resolve(false);
        } catch (err) {
          resolve(false);
        }
      });

    // Descarga un archivo HTML limpio con todos los datos actuales incrustados
    const downloadStandaloneHtml = (filename = 'HybridOS.html', snapshotData = null) => {
      try {
        const clone = document.documentElement.cloneNode(true);
        const rootEl = clone.querySelector('#root');
        if (rootEl) rootEl.innerHTML = '';
        clone.querySelectorAll('style:not([data-keep="true"]), script:not([data-keep="true"])').forEach((el) => el.remove());
        const stateTag = clone.querySelector('#initial-embedded-state');
        if (stateTag && snapshotData) {
          stateTag.textContent = JSON.stringify(snapshotData).replace(/</g, '\\u003c');
        }
        const htmlStr = '<!DOCTYPE html>\n' + clone.outerHTML;
        const blob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return true;
      } catch (err) {
        console.error('Error generando descargable HTML:', err);
        return false;
      }
    };

    // Copia segura al portapapeles compatible con iPhone / iFrames (usa execCommand como respaldo)
    const copyTextSafe = async (text) => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) return true;
      } catch (e) {
        // continúa al método clipboard si existe
      }
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {
        // sin permisos
      }
      return false;
    };

    const isSundayISO = (iso) => {
      if (!iso) return false;
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d).getDay() === 0;
    };

    const daysUntilNextSunday = (iso) => {
      const [y, m, d] = iso.split('-').map(Number);
      const dow = new Date(y, m - 1, d).getDay();
      return dow === 0 ? 0 : 7 - dow;
    };

    const formatHumanDate = (iso) => {
      if (!iso) return '';
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return `${WEEKDAYS_FULL[dt.getDay()]} ${d} ${MONTHS_ES[m - 1].slice(0, 3)} ${y}`;
    };

      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);

      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;

    const playTimerBeep = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        [880, 1174.66].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.16);
          gain.gain.setValueAtTime(0.08, now + idx * 0.16);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.16 + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.16);
          osc.stop(now + idx * 0.16 + 0.24);
        });
      } catch (e) {
        // Silencioso si está bloqueado
      }
    };

    const compressImageToBase64 = (file, maxDim = 800) =>
      new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Error leyendo imagen'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Imagen no válida'));
          img.onload = () => {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
            const base64 = dataUrl.split(',')[1];
            resolve({ base64, mimeType: 'image/jpeg', previewUrl: dataUrl });
          };
          img.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });

    /* ============================================================================
     * 6. MOTORES DE CÁLCULO (ANTROPOMETRÍA, PROGRESIÓN, PERIODIZACIÓN, DIETA)

    const calcE1RM = (weight, reps) => {
      const w = Number(weight) || 0;
      const r = Number(reps) || 0;
      if (w <= 0 || r <= 0) return 0;
      if (r === 1) return Math.round(w * 10) / 10;
      return Math.round(w * (1 + r / 30) * 10) / 10;
    };

    const calcBodyComposition = (m, sex = 'M') => {
      const weight = Number(m?.weight) || 78;
      const height = Number(m?.height) || 178;
      const waist = Number(m?.waist) || 82;
      const neck = Number(m?.neck) || 38;
      const hip = Number(m?.hip) || 96;

      let bfPct = Number(m?.manualBfPct) || 0;
      if (!bfPct && height > 100 && waist > neck + 5) {
        if (sex === 'F') {
          const denom = 1.29579 - 0.35004 * Math.log10(Math.max(10, waist + hip - neck)) + 0.221 * Math.log10(height);
          bfPct = 495 / denom - 450;
        } else {
          const denom = 1.0324 - 0.19077 * Math.log10(Math.max(10, waist - neck)) + 0.15456 * Math.log10(height);
          bfPct = 495 / denom - 450;
        }
      }
      bfPct = Math.max(5, Math.min(45, Math.round(bfPct * 10) / 10));
      const fatMassKg = Math.round(weight * (bfPct / 100) * 10) / 10;
      const leanMassKg = Math.round((weight - fatMassKg) * 10) / 10;
      const heightM = height / 100;
      const bmi = Math.round((weight / (heightM * heightM)) * 10) / 10;
      const ffmi = Math.round((leanMassKg / (heightM * heightM)) * 10) / 10;
      return { bfPct, fatMassKg, leanMassKg, bmi, ffmi };
    };

    const calcBodyProportions = (m) => {
      const height = Number(m?.height) || 178;
      const shoulders = Number(m?.shoulders) || 118;
      const chest = Number(m?.chest) || 103;
      const waist = Number(m?.waist) || 82;
      const bicepL = Number(m?.bicepL) || 36.5;
      const bicepR = Number(m?.bicepR) || 37;
      const forearmL = Number(m?.forearmL) || 29.2;
      const forearmR = Number(m?.forearmR) || 29.7;
      const thighL = Number(m?.thighL) || 56.5;
      const thighR = Number(m?.thighR) || 57;
      const calfL = Number(m?.calfL) || 37;
      const calfR = Number(m?.calfR) || 37.2;

      const avgBicep = Math.round(((bicepL + bicepR) / 2) * 10) / 10;
      const avgForearm = Math.round(((forearmL + forearmR) / 2) * 10) / 10;
      const avgThigh = Math.round(((thighL + thighR) / 2) * 10) / 10;
      const avgCalf = Math.round(((calfL + calfR) / 2) * 10) / 10;

      const vTaper = Math.round((shoulders / Math.max(40, waist)) * 100) / 100;
      const chestWaist = Math.round((chest / Math.max(40, waist)) * 100) / 100;
      const waistHeight = Math.round((waist / Math.max(120, height)) * 1000) / 1000;
      const armCalf = Math.round((avgBicep / Math.max(20, avgCalf)) * 100) / 100;
      const thighCalf = Math.round((avgThigh / Math.max(20, avgCalf)) * 100) / 100;

      const evalPair = (label, left, right) => {
        const diff = Math.round(Math.abs(left - right) * 10) / 10;
        const pct = Math.round((diff / Math.max(10, Math.max(left, right))) * 1000) / 10;
        const dominant = Math.abs(left - right) < 0.2 ? 'Equilibrado' : left > right ? 'Izquierda +' : 'Derecha +';
        const status = diff <= 0.8 ? 'Óptima' : diff <= 1.6 ? 'Vigilar' : 'Desequilibrio';
        return { label, left, right, diff, pct, dominant, status };
      };

      const symmetries = [
        evalPair('Bíceps', bicepL, bicepR),
        evalPair('Antebrazo', forearmL, forearmR),
        evalPair('Muslo', thighL, thighR),
        evalPair('Gemelo', calfL, calfR)
      ];

      const totalDiff = symmetries.reduce((acc, s) => acc + s.diff, 0);
      const symmetryScore = Math.max(55, Math.min(100, Math.round(100 - totalDiff * 6)));

      let propPoints = 100;
      if (vTaper < 1.4) propPoints -= (1.4 - vTaper) * 45;
      if (waistHeight > 0.47) propPoints -= (waistHeight - 0.47) * 260;
      if (chestWaist < 1.23) propPoints -= (1.23 - chestWaist) * 50;
      if (Math.abs(armCalf - 1.0) > 0.06) propPoints -= (Math.abs(armCalf - 1.0) - 0.06) * 110;
      const proportionScore = Math.max(45, Math.min(100, Math.round(propPoints)));
      const balancedIndex = Math.round(symmetryScore * 0.45 + proportionScore * 0.55);

      return { avgBicep, avgForearm, avgThigh, avgCalf, vTaper, chestWaist, waistHeight, armCalf, thighCalf, symmetries, symmetryScore, proportionScore, balancedIndex };
    };

    const calcHybridPillarsScore = (latestMeasure, firstMeasure, completedSessions, sex = 'M') => {

      const idealBfMid = sex === 'F' ? 20 : 12.5;
      const bfPenalty = Math.max(0, Math.abs(comp.bfPct - idealBfMid) * 3.2);
      const whPenalty = Math.max(0, (prop.waistHeight - 0.46) * 180);
      const waistDelta = firstMeasure ? (Number(firstMeasure.waist) - Number(latestMeasure.waist)) : 0;
      const bodyCompScore = Math.max(40, Math.min(98, Math.round(92 - bfPenalty - whPenalty + waistDelta * 2.5)));

    const computeExerciseProgression = (exerciseId, routineExConfig, completedSessions, deloadActive = false) => {
      const exMeta = getExerciseById(exerciseId);
      const minReps = routineExConfig?.minReps || 8;
      const maxReps = routineExConfig?.maxReps || 12;
      const targetRir = routineExConfig?.targetRir ?? 2;

      const history = [];
      completedSessions
        .slice()
        .sort((a, b) => a.date.localeCompare(b.date))
        .forEach((sess) => {
          const found = (sess.exercises || []).find((e) => e.exerciseId === exerciseId);
          if (found && found.sets && found.sets.length > 0) {
            const bestE1RM = Math.max(...found.sets.map((st) => calcE1RM(st.weight, st.reps)));
            const avgWeight = found.sets.reduce((acc, st) => acc + (Number(st.weight) || 0), 0) / found.sets.length;
            const avgReps = found.sets.reduce((acc, st) => acc + (Number(st.reps) || 0), 0) / found.sets.length;
            const avgRir = found.sets.reduce((acc, st) => acc + (Number(st.rir) ?? targetRir), 0) / found.sets.length;
            history.push({ date: sess.date, sets: found.sets, bestE1RM, avgWeight, avgReps, avgRir });
          }
        });

      if (history.length === 0) {
        return {
          hasHistory: false, lastSets: null, bestE1RM: 0, stagnant: false,
          suggestionText: `Sin historial previo. Inicia en RIR ${targetRir} (${minReps}–${maxReps} ${exMeta.unit === 'seg' ? 's' : 'reps'}).`,
          suggestedWeight: null, suggestedReps: minReps, badgeColor: 'cyan'
        };
      }

      const last = history[history.length - 1];
      const prev = history.length >= 2 ? history[history.length - 2] : null;
      const prev2 = history.length >= 3 ? history[history.length - 3] : null;
      const stagnant = Boolean(prev && prev2 && last.bestE1RM <= prev.bestE1RM && prev.bestE1RM <= prev2.bestE1RM);

      const lastW = Math.round((last.sets[0]?.weight || last.avgWeight) * 2) / 2;
      const lastR = Math.round(last.avgReps);
      const lastRir = Math.round(last.avgRir * 10) / 10;

      if (deloadActive) {
        const deloadW = Math.max(0, Math.round((lastW * 0.9) * 2) / 2);
        return {
          hasHistory: true, lastSets: last.sets, bestE1RM: last.bestE1RM, stagnant,
          suggestedWeight: deloadW, suggestedReps: minReps, badgeColor: 'amber',
          suggestionText: `Descarga activa: baja a ${deloadW} ${exMeta.unit} × ${minReps} reps (RIR 3–4).`
        };
      }

      const stepKg = exMeta.type === 'dumbbell_compound' || exMeta.type === 'dumbbell_isolation' || exMeta.type === 'isolation' ? 2 : 2.5;

      if (lastR >= maxReps && lastRir >= targetRir) {
        const nextW = Math.round((lastW + stepKg) * 2) / 2;
        return {
          hasHistory: true, lastSets: last.sets, bestE1RM: last.bestE1RM, stagnant,
          suggestedWeight: nextW, suggestedReps: minReps, badgeColor: 'lime',
          suggestionText: `¡Progresión! Sube a ${nextW} ${exMeta.unit} y busca ${minReps} reps (RIR ${targetRir}).`
        };
      }
      if (lastRir < targetRir - 0.5 || lastR < minReps) {
        const saferW = lastR < minReps - 1 ? Math.max(0, Math.round((lastW * 0.95) * 2) / 2) : lastW;
        return {
          hasHistory: true, lastSets: last.sets, bestE1RM: last.bestE1RM, stagnant,
          suggestedWeight: saferW, suggestedReps: minReps, badgeColor: 'amber',
          suggestionText: `Consolida técnica: ${saferW} ${exMeta.unit} × ${minReps} reps sin bajar de RIR ${targetRir}.`
        };
      }
      const nextR = Math.min(maxReps, lastR + 1);
      return {
        hasHistory: true, lastSets: last.sets, bestE1RM: last.bestE1RM, stagnant,
        suggestedWeight: lastW, suggestedReps: nextR, badgeColor: 'cyan',
        suggestionText: `Mantén ${lastW} ${exMeta.unit} e intenta subir a ${nextR} reps en RIR ${targetRir}.`
      };
    };

        id: 'sess_flex_1', date: addDaysISO(TODAY_ISO, -4), routineId: 'flexibilidad_movilidad_global', routineName: 'Flexibilidad & Rango Completo Atleta 20\'', discipline: 'mobility', durationMin: 20, rpe: 4, shoulderFatigue: 1, kneeFatigue: 1, exercises: []
      },
      {
        id: 'sess_simetria', date: addDaysISO(TODAY_ISO, -2), routineId: 'simetria_cuerpo_equilibrado', routineName: 'Cuerpo Equilibrado — V-Taper, Simetría & Unilateral 50\'', discipline: 'strength', durationMin: 52, rpe: 8, shoulderFatigue: 2, kneeFatigue: 2,
        exercises: [
          { exerciseId: 'press_inclinado_30', sets: [{ weight: 26, reps: 10, rir: 2 }, { weight: 26, reps: 10, rir: 2 }, { weight: 26, reps: 9, rir: 2 }] },
          { exerciseId: 'jalon_pronado_dominadas', sets: [{ weight: 65, reps: 8, rir: 2 }, { weight: 65, reps: 8, rir: 2 }, { weight: 65, reps: 8, rir: 2 }] },
          { exerciseId: 'prensa_unilateral_zancadas', sets: [{ weight: 34, reps: 10, rir: 2 }, { weight: 34, reps: 10, rir: 2 }, { weight: 34, reps: 10, rir: 2 }] },
          { exerciseId: 'facepull', sets: [{ weight: 25, reps: 15, rir: 2 }, { weight: 25, reps: 15, rir: 2 }, { weight: 25, reps: 15, rir: 2 }] }
        ]
      },
      {
        id: 'sess_explosiva', date: addDaysISO(TODAY_ISO, -1), routineId: 'explosividad_potencia_total', routineName: 'Explosividad Total — Saltos, Swing & Balístico 35\'', discipline: 'agility', durationMin: 35, rpe: 7.5, shoulderFatigue: 2, kneeFatigue: 3,
        exercises: [{ exerciseId: 'kettlebell_swing', sets: [{ weight: 20, reps: 15, rir: 2 }, { weight: 20, reps: 15, rir: 2 }, { weight: 20, reps: 15, rir: 2 }] }]
      }
    ];

    const buildTrainingReview = (completedSessions = [], bodyCheckins = [], allRoutines = ROUTINES_DB, athleteSex = 'M', currentBlockId = 1, blockWeek = 1, deloadActive = false, scheduledWorkouts = []) => {
      const fallbackCheckin = createInitialBodyCheckins()[2];
      const sorted = (bodyCheckins || []).slice().sort((a, b) => b.date.localeCompare(a.date));
      const latest = sorted[0] || fallbackCheckin;
      const previous = sorted[1] || null;
      const baseline = sorted[sorted.length - 1] || latest;

      const comp = calcBodyComposition(latest, athleteSex);
      const prop = calcBodyProportions(latest);
      const pillars = calcHybridPillarsScore(latest, baseline, completedSessions, athleteSex);
      const currentBlock = ANNUAL_BLOCKS.find((b) => b.id === currentBlockId) || ANNUAL_BLOCKS[0];

      const weakestPillar = pillars.slice().sort((a, b) => a.score - b.score)[0] || pillars[0];
      const maxAsym = prop.symmetries.slice().sort((a, b) => b.diff - a.diff)[0];

      const focusMap = { bodyComp: 'Composición & Simetría', strength: 'Fuerza & Hipertrofia', explosiveness: 'Explosividad & Potencia', agility: 'Agilidad & Reactividad', flexibility: 'Flexibilidad & Movilidad' };
      let priorityFocus = focusMap[weakestPillar?.key] || 'Composición & Simetría';
      if (deloadActive) priorityFocus = 'Descarga & Recuperación';
      else if (maxAsym && maxAsym.diff >= 0.9 && weakestPillar?.score >= 65) priorityFocus = 'Simetría & Cuerpo Equilibrado';

      const insights = [];
      insights.push(`Cuerpo Equilibrado en ${prop.balancedIndex}/100 (${comp.bfPct}% grasa, cintura ${latest.waist} cm, V-Taper ${prop.vTaper}).`);

      if (previous) {
        const waistDelta = Math.round((Number(latest.waist) - Number(previous.waist)) * 10) / 10;
        if (waistDelta <= -0.3) insights.push(`Cintura bajó ${Math.abs(waistDelta)} cm frente al último registro preservando masa magra (${comp.leanMassKg} kg).`);
        else if (waistDelta >= 0.4) insights.push(`Cintura subió +${waistDelta} cm: priorizamos sesiones densas metabólicas y control calórico.`);
      }
      if (maxAsym && maxAsym.diff >= 0.6) insights.push(`Asimetría leve en ${maxAsym.label} (Δ ${maxAsym.diff} cm, ${maxAsym.dominant}): reforzamos trabajo unilateral.`);
      insights.push(`Pilar con mayor margen de subida: ${weakestPillar?.label} (${weakestPillar?.score}/100).`);

      const readyToProgress = ['press_banca_mancuernas', 'press_inclinado_30', 'prensa_piernas', 'peso_muerto_rumano', 'jalon_pronado_dominadas']
        .map((eid) => {
          const prog = computeExerciseProgression(eid, { minReps: 8, maxReps: 10, targetRir: 2 }, completedSessions, deloadActive);
          return prog.badgeColor === 'lime' ? getExerciseById(eid).name : null;
        })
        .filter(Boolean);
      if (readyToProgress.length > 0) insights.push(`Listos para subir peso en la próxima sesión: ${readyToProgress.slice(0, 2).join(', ')}.`);

      const recent7 = completedSessions.filter((s) => s.date >= addDaysISO(TODAY_ISO, -7));
      const maxShoulder = Math.max(0, ...recent7.map((s) => Number(s.shoulderFatigue) || 0));
      const maxKnee = Math.max(0, ...recent7.map((s) => Number(s.kneeFatigue) || 0));
      if (maxShoulder >= 4 || maxKnee >= 4) {
        insights.push(`Fatiga articular elevada en ${maxShoulder >= 4 ? 'Hombro' : ''}${maxShoulder >= 4 && maxKnee >= 4 ? ' y ' : ''}${maxKnee >= 4 ? 'Rodilla' : ''}: modulamos cargas.`);
      }

      const recentIncomplete = (scheduledWorkouts || []).filter((s) => s.status === 'incomplete' && s.date >= addDaysISO(TODAY_ISO, -7)).length;
      if (recentIncomplete > 0) insights.push(`Tienes ${recentIncomplete} sesión(es) no completada(s) esta semana: redistribuimos el plan sin saturarte.`);

      return { latest, previous, baseline, comp, prop, pillars, currentBlock, weakestPillar, maxAsym, priorityFocus, insights };
    };

    const generateAdaptiveMesocycle = ({ startISO = TODAY_ISO, weeks = 4, schedulePrefs = { trainingWeekdays: [1, 2, 4, 5], includeSundayFlex: true }, completedSessions = [], bodyCheckins = [], allRoutines = ROUTINES_DB, athleteSex = 'M', currentBlockId = 1, blockWeek = 1, deloadActive = false, scheduledWorkouts = [] } = {}) => {
      const review = buildTrainingReview(completedSessions, bodyCheckins, allRoutines, athleteSex, currentBlockId, blockWeek, deloadActive, scheduledWorkouts);
      const validIds = new Set((allRoutines || ROUTINES_DB).map((r) => r.id));
      const ensureId = (id) => (validIds.has(id) ? id : 'simetria_cuerpo_equilibrado');

      const trainingWeekdays = Array.isArray(schedulePrefs?.trainingWeekdays) && schedulePrefs.trainingWeekdays.length > 0 ? schedulePrefs.trainingWeekdays : [1, 2, 4, 5];
      const includeSundayFlex = schedulePrefs?.includeSundayFlex !== false;

      const blockRotations = {
        1: ['simetria_cuerpo_equilibrado', 'pierna_a', 'torso_a', 'recomp_metabolica_hibrida', 'explosividad_potencia_total'],
        2: ['fuerza_5x5', 'explosividad_potencia_total', 'torso_b', 'pierna_b', 'hombro_pierna_blindaje'],
        3: ['recomp_metabolica_hibrida', 'agilidad_reactiva_circuito', 'torso_a', 'pierna_a', 'potencia_pliometria_hibrida'],
        4: ['full_body_equilibrado', 'explosividad_potencia_total', 'simetria_cuerpo_equilibrado', 'agilidad_reactiva_circuito', 'torso_b']
      };

      const rotation = (blockRotations[currentBlockId] || blockRotations[1]).slice();
      const weakKey = review.weakestPillar?.key;
      if (weakKey === 'explosiveness' && !rotation.includes('explosividad_potencia_total')) rotation[1] = 'explosividad_potencia_total';
      else if (weakKey === 'agility' && !rotation.includes('agilidad_reactiva_circuito')) rotation[3] = 'agilidad_reactiva_circuito';
      else if (weakKey === 'flexibility' && !rotation.includes('flexibilidad_movilidad_global')) rotation[3] = 'flexibilidad_movilidad_global';
      else if (weakKey === 'bodyComp' || (review.maxAsym && review.maxAsym.diff >= 0.8)) {
        rotation[0] = 'simetria_cuerpo_equilibrado';
        if (!rotation.includes('recomp_metabolica_hibrida')) rotation[2] = 'recomp_metabolica_hibrida';
      }

      const deloadRotation = ['simetria_cuerpo_equilibrado', 'flexibilidad_movilidad_global', 'agilidad_reactiva_circuito', 'torso_express'];
      const phaseLabels = ['Sem 1 Base Técnica', 'Sem 2 Sobrecarga Progresiva', 'Sem 3 Intensificación', 'Sem 4 Descarga y Evaluación'];

      const out = [];
      let sessionCounter = 0;

      for (let offset = 0; offset < weeks * 7; offset += 1) {
        const dateISO = addDaysISO(startISO, offset);
        const [y, m, d] = dateISO.split('-').map(Number);
        const dow = new Date(y, m - 1, d).getDay();
        const weekIdx = Math.min(3, Math.floor(offset / 7));
        const phaseLabel = phaseLabels[weekIdx];

        if (dow === 0 && includeSundayFlex && !trainingWeekdays.includes(0)) {
          const sunRoutine = weekIdx === 3 || deloadActive ? 'movilidad_toracica_descarga' : 'flexibilidad_movilidad_global';
          out.push({ id: `sch_auto_${dateISO}_sun`, date: dateISO, routineId: ensureId(sunRoutine), status: 'pending', phaseNote: `${phaseLabel} · Flexibilidad y Check-in Medidas` });
          continue;
        }

        if (trainingWeekdays.includes(dow)) {
          const isWaveDeload = deloadActive || weekIdx === 3;
          const pool = isWaveDeload ? deloadRotation : rotation;
          const pickedId = ensureId(pool[sessionCounter % pool.length]);
          sessionCounter += 1;
          out.push({
            id: `sch_auto_${dateISO}_${sessionCounter}`,
            date: dateISO,
            routineId: pickedId,
            status: 'pending',
            phaseNote: isWaveDeload ? `${phaseLabel} · Volumen moderado (RIR 3)` : `${phaseLabel} · Foco: ${review.priorityFocus}`
          });
        }
      }
      return out;
    };

    const NUTRITION_GOALS = [

    const estimateMealLocally = (text = '') => {
      const t = text.toLowerCase();
      if (!t.trim()) return { mealName: 'Plato equilibrado estándar', estimatedKcal: 480, proteinG: 34, carbsG: 42, fatG: 18, ingredientsSummary: 'Estimación base modificable', tip: 'Ajusta el multiplicador según el tamaño real del plato.' };
      const rules = [
        { keys: ['pollo', 'pavo', 'pechuga'], p: 36, c: 35, f: 12 },
        { keys: ['salmón', 'salmon', 'atún', 'atun', 'merluza', 'pescado', 'lubina'], p: 34, c: 25, f: 16 },
        { keys: ['ternera', 'hamburguesa', 'carne', 'solomillo'], p: 35, c: 30, f: 19 },
        { keys: ['huevo', 'tortilla', 'revuelto'], p: 24, c: 12, f: 18 },
        { keys: ['arroz', 'pasta', 'macarrones', 'quinoa', 'patata', 'boniato', 'pan', 'tostada'], p: 10, c: 48, f: 6 },
        { keys: ['ensalada', 'verdura', 'brócoli', 'brocoli', 'calabacín'], p: 8, c: 16, f: 8 },
        { keys: ['yogur', 'skyr', 'queso fresco', 'batido', 'whey'], p: 25, c: 18, f: 6 },
        { keys: ['aguacate', 'aceite', 'nueces', 'almendras', 'cacahuete'], p: 5, c: 6, f: 15 },
        { keys: ['pizza', 'bocadillo', 'burguer', 'restaurante', 'menú', 'menu'], p: 28, c: 72, f: 28 }
      ];
      let p = 0; let c = 0; let f = 0; let hits = 0;
      rules.forEach((r) => { if (r.keys.some((k) => t.includes(k))) { p += r.p; c += r.c; f += r.f; hits += 1; } });
      if (hits === 0) { p = 30; c = 45; f = 17; }
      else if (hits > 1) { p = Math.round(p * 0.72); c = Math.round(c * 0.75); f = Math.round(f * 0.72); }
      return {
        mealName: text.trim().slice(0, 60),
        estimatedKcal: Math.round(p * 4 + c * 4 + f * 9),
        proteinG: p, carbsG: c, fatG: f,
        ingredientsSummary: 'Estimación local automática (editable antes de guardar)',
        tip: 'Puedes añadir tu API Key Gemini en Plan > Ajustes para analizar fotos reales fuera del chat.'
      };
    };

    const calcDailyNutritionTargets = ({ latestMeasure, previousMeasure, firstMeasure, athleteSex = 'M', athleteAge = 36, nutritionGoal = 'recomp', activityLevel = 'office', targetDateISO = TODAY_ISO, completedSessions = [], scheduledWorkouts = [], allRoutines = ROUTINES_DB }) => {
      const m = latestMeasure || createInitialBodyCheckins()[2];
      const comp = calcBodyComposition(m, athleteSex);
      const weight = Number(m.weight) || 79;
      const height = Number(m.height) || 178;
      const age = Number(athleteAge) || 36;

      const bmrKatch = 370 + 21.6 * comp.leanMassKg;
      const bmrMifflin = 10 * weight + 6.25 * height - 5 * age + (athleteSex === 'F' ? -161 : 5);
      const bmr = Math.round(bmrKatch * 0.65 + bmrMifflin * 0.35);

      const neatMult = activityLevel === 'active_job' ? 1.48 : activityLevel === 'sedentary' ? 1.25 : 1.35;
      const baseOfficeTDEE = Math.round(bmr * neatMult);

      const doneToday = completedSessions.filter((s) => s.date === targetDateISO);
      const pendingToday = scheduledWorkouts.filter((s) => s.date === targetDateISO && s.status === 'pending');

      const estimateSessionKcal = (disc, durMin) => {
        const d = Number(durMin) || 50;
        switch (disc) {
          case 'strength': return Math.round(220 + d * 1.8);
          case 'agility': return Math.round(180 + d * 2.5);
          case 'padel': return Math.round(d * 5.6);
          case 'running': return Math.round(d * 8.5);
          case 'external': return Math.round(d * 5.0);
          case 'mobility': return Math.round(d * 2.2);
          default: return 240;
        }
      };

      let workoutBonusKcal = 0;
      const workoutLabels = [];
      if (doneToday.length > 0) {
        doneToday.forEach((s) => { workoutBonusKcal += estimateSessionKcal(s.discipline, s.durationMin); workoutLabels.push(s.routineName.split('—')[0].trim()); });
      } else if (pendingToday.length > 0) {
        pendingToday.forEach((sch) => {
          const r = allRoutines.find((x) => x.id === sch.routineId);
          if (r) { workoutBonusKcal += estimateSessionKcal(r.discipline, r.estimatedMin); workoutLabels.push(r.name.split('—')[0].trim()); }
        });
      }

      const workoutLabel = workoutLabels.length > 0 ? `${workoutLabels.join(' + ')} (+${workoutBonusKcal} kcal)` : 'Día de oficina / descanso (+0 kcal)';

      const compareMeasure = previousMeasure || firstMeasure;
      let adaptiveDeltaKcal = 0;
      let adaptiveReason = 'Evolución en ritmo óptimo respecto a tu último check-in.';
      if (compareMeasure && compareMeasure.date !== m.date) {
        const waistDiff = Math.round((Number(m.waist) - Number(compareMeasure.waist)) * 10) / 10;
        const weightDiff = Math.round((Number(m.weight) - Number(compareMeasure.weight)) * 10) / 10;
        if (nutritionGoal === 'recomp' || nutritionGoal === 'cut') {
          if (waistDiff >= 0.1 && weightDiff >= 0 && comp.bfPct > (athleteSex === 'F' ? 20 : 12.5)) {
            adaptiveDeltaKcal = -120;
            adaptiveReason = `Cintura estable/al alza (${waistDiff >= 0 ? `+${waistDiff}` : waistDiff}cm): reajustamos -120 kcal.`;
          } else if (weightDiff <= -0.8) {
            adaptiveDeltaKcal = 120;
            adaptiveReason = `Bajada rápida (${weightDiff}kg): sumamos +120 kcal para proteger músculo y potencia.`;
          } else if (waistDiff <= -0.4) {
            adaptiveReason = `Cintura bajó ${Math.abs(waistDiff)}cm manteniendo fuerza: mantenemos calorías actuales.`;
          }
        } else if (nutritionGoal === 'lean_gain') {
          if (weightDiff <= 0) { adaptiveDeltaKcal = 130; adaptiveReason = 'Peso estancado en fase de ganancia: sumamos +130 kcal.'; }
          else if (waistDiff >= 0.7) { adaptiveDeltaKcal = -100; adaptiveReason = `Cintura subió +${waistDiff}cm: moderamos -100 kcal para subida limpia.`; }
        }
      }

      const goalOffset = nutritionGoal === 'cut' ? -350 : nutritionGoal === 'recomp' ? -150 : nutritionGoal === 'lean_gain' ? 200 : 0;
      const tdeeToday = baseOfficeTDEE + workoutBonusKcal;
      const minFloor = athleteSex === 'F' ? 1350 : 1650;
      const targetKcal = Math.max(minFloor, Math.round((tdeeToday + goalOffset + adaptiveDeltaKcal) / 10) * 10);

      const proteinPerKg = nutritionGoal === 'cut' ? 2.1 : 2.0;
      const proteinG = Math.round(weight * proteinPerKg);
      const fatG = Math.round(weight * 0.85);
      const carbsG = Math.round(Math.max(240, targetKcal - proteinG * 4 - fatG * 9) / 4);
      const goalMeta = NUTRITION_GOALS.find((g) => g.id === nutritionGoal) || NUTRITION_GOALS[0];

      return { bmr, baseOfficeTDEE, workoutBonusKcal, workoutLabel, tdeeToday, targetKcal, proteinG, fatG, carbsG, adaptiveDeltaKcal, adaptiveReason, goalLabel: goalMeta.label, comp };
    };

    const buildGeminiSnapshotText = ({ athleteSex, athleteAge = 36, nutritionGoal = 'recomp', activityLevel = 'office', nutritionLogs = [], bodyCheckins, completedSessions, scheduledWorkouts, allRoutines, currentBlockId, blockWeek, deloadActive, schedulePrefs }) => {
      const review = buildTrainingReview(completedSessions, bodyCheckins, allRoutines, athleteSex, currentBlockId, blockWeek, deloadActive, scheduledWorkouts);
      const sortedMeasures = (bodyCheckins || []).slice().sort((a, b) => b.date.localeCompare(a.date));
      const nutriTargets = calcDailyNutritionTargets({
        latestMeasure: sortedMeasures[0], previousMeasure: sortedMeasures[1], firstMeasure: sortedMeasures[sortedMeasures.length - 1],
        athleteSex, athleteAge, nutritionGoal, activityLevel, targetDateISO: TODAY_ISO, completedSessions, scheduledWorkouts, allRoutines
      });

    const GeminiCoachModal = ({ onClose, athleteSex, athleteAge, nutritionGoal, activityLevel, nutritionLogs, bodyCheckins, completedSessions, scheduledWorkouts, allRoutines, currentBlockId, blockWeek, deloadActive, schedulePrefs, customGeminiKey, onApplyPlan, onCopySnapshot }) => {
      const [messages, setMessages] = useState([
        { role: 'model', text: 'Tengo acceso directo a tus medidas corporales, simetrías, cargas, RIR, días marcados como no completados, actividades libres y tu calendario. Pídeme revisar tus datos o ajustar tus próximas rutinas.', plan: null, applied: false }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [showHelp, setShowHelp] = useState(true);

      const callGeminiWithBackoff = async (payload) => {
        const apiKey = customGeminiKey || '';
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        const delays = [1000, 2000, 4000];
        for (let attempt = 0; attempt <= delays.length; attempt += 1) {
          const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (res.ok) return await res.json();
          if (attempt < delays.length && (res.status === 429 || res.status >= 500)) { await new Promise((r) => setTimeout(r, delays[attempt])); continue; }
          throw new Error(`Error HTTP ${res.status}`);
        }
        return null;
      };

      const handleSend = async (customText) => {
        const queryText = (customText || input).trim();
        if (!queryText || loading) return;
        setInput('');
        setShowHelp(false);

        const userMsg = { role: 'user', text: queryText };
        const nextHistory = [...messages, userMsg];
        setMessages(nextHistory);
        setLoading(true);

        const snapshot = buildGeminiSnapshotText({ athleteSex, athleteAge, nutritionGoal, activityLevel, nutritionLogs, bodyCheckins, completedSessions, scheduledWorkouts, allRoutines, currentBlockId, blockWeek, deloadActive, schedulePrefs });
        const availableRoutinesList = allRoutines.map((r) => `${r.id} (${r.name})`).join(' | ');
        const availableExercisesList = EXERCISES_DB.map((e) => `${e.id} (${e.name})`).join(' | ');

        const systemPrompt = [
          'Eres el Coach experto en Nutrición Deportiva, Readaptación y Entrenamiento de HybridOS.',
          'Tienes acceso total en tiempo real a los datos del usuario: medidas antropométricas, simetría bilateral, historial de cargas/RIR/e1RM, fatiga de hombro/rodilla, sesiones marcadas como no completadas, actividades externas registradas y calendario.',
          'Responde siempre en español claro, cercano y accionable.',
          'Cuando el usuario pida revisar datos, cambiar rutinas, recuperar un día no completado o crear una rutina nueva, rellena scheduleUpdates (usando SOLO routineId válidos) y/o newCustomRoutine (usando SOLO exerciseIds válidos) con fechas reales YYYY-MM-DD.',
          `Fecha actual: ${TODAY_ISO}.`,
          `RUTINAS VÁLIDAS: ${availableRoutinesList}`,
          `EJERCICIOS VÁLIDOS: ${availableExercisesList}`
        ].join('\n');

        const conversationTurns = nextHistory.slice(-6).map((m) => ({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{ text: m.role === 'user' ? `${m.text}\n\n[DATOS ACTUALES DE LA APP]:\n${snapshot}` : m.text }]
        }));

        const payload = {
          contents: conversationTurns,
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: {
                reply: { type: 'STRING' },
                nutritionFocus: { type: 'STRING' },
                actionSummary: { type: 'STRING' },
                shouldUpdateSchedule: { type: 'BOOLEAN' },
                recommendedBlockId: { type: 'INTEGER' },
                activateDeload: { type: 'BOOLEAN' },
                scheduleUpdates: { type: 'ARRAY', items: { type: 'OBJECT', properties: { date: { type: 'STRING' }, routineId: { type: 'STRING' }, reason: { type: 'STRING' } } } },
                newCustomRoutine: { type: 'OBJECT', properties: { create: { type: 'BOOLEAN' }, name: { type: 'STRING' }, category: { type: 'STRING' }, discipline: { type: 'STRING' }, description: { type: 'STRING' }, exerciseIds: { type: 'ARRAY', items: { type: 'STRING' } } } }
              }
            }
          }
        };

        try {
          const result = await callGeminiWithBackoff(payload);
          const rawJson = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawJson) throw new Error('Respuesta vacía');
          const parsed = JSON.parse(rawJson);
          const hasAction = (parsed.shouldUpdateSchedule && parsed.scheduleUpdates?.length > 0) || (parsed.newCustomRoutine?.create && parsed.newCustomRoutine?.exerciseIds?.length > 0);
          setMessages((prev) => [...prev, { role: 'model', text: parsed.reply || 'He analizado tus datos.', nutritionFocus: parsed.nutritionFocus || '', plan: hasAction ? parsed : null, applied: false }]);
        } catch (err) {
          const localRev = buildTrainingReview(completedSessions, bodyCheckins, allRoutines, athleteSex, currentBlockId, blockWeek, deloadActive, scheduledWorkouts);
          setMessages((prev) => [
            ...prev,
            { role: 'model', text: `Auditoría local instantánea: ${localRev.insights.join(' ')} (Si usas la app descargada fuera de este chat, añade tu API Key gratuita de Gemini en el botón Descargar > Ajustes IA, o pulsa "Copiar" para pegarlo en nuestro chat).`, plan: null, applied: false }
          ]);
        } finally {
          setLoading(false);
        }
      };

      const quickPrompts = [
        'Revisa mis medidas y días no completados y ajusta esta semana',
        'Hoy jugué al pádel / salí a correr: adapta mis próximos 3 días',
        '¿Qué pesos debo subir y cómo corrijo mi simetría?',
        '¿Qué debo comer hoy para bajar % grasa y rendir?'
      ];

      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="w-full max-w-md bg-white border border-gray-200 rounded-t-3xl sm:rounded-3xl h-[88vh] flex flex-col shadow-2xl overflow-hidden text-[#111111]">
            <div className="p-4 border-b border-gray-200 bg-white flex items-center justify-between gap-2">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-2xl bg-[#800020] text-white flex items-center justify-center"><Sparkles className="w-5 h-5" /></div>
                <div>
                  <h3 className="text-sm font-extrabold text-[#111111] leading-none">Coach Gemini IA</h3>
                  <p className="text-[10px] text-[#800020] font-semibold mt-1">Lectura y ajuste de medidas, cargas y calendario</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button onClick={() => setShowHelp((s) => !s)} className="px-2 py-1.5 rounded-xl bg-gray-100 text-[10px] font-bold text-[#111111]">{showHelp ? 'Ocultar' : 'Guía'}</button>
                <button onClick={onCopySnapshot} className="px-2.5 py-1.5 rounded-xl bg-[#FDF2F4] border border-[#F3C6D0] text-[10px] font-bold text-[#800020] flex items-center gap-1"><Copy className="w-3.5 h-3.5" /> Copiar</button>
                <button onClick={onClose} className="p-2 rounded-xl bg-gray-100 text-gray-600"><X className="w-4 h-4" /></button>
              </div>
            </div>

            {showHelp && (
              <div className="px-4 py-2.5 bg-[#FDF2F4] border-b border-[#F3C6D0] text-[11px] text-gray-700 leading-snug">
                <strong className="text-[#800020]">Funciones:</strong> lee medidas, cargas y días <em>No completados</em>, ajusta el calendario, crea rutinas y te guía en nutrición.
              </div>
            )}

            <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-[#F7F7F8]">
              {messages.map((m, idx) => (
                <div key={idx} className={`flex flex-col ${m.role === 'user' ? 'items-end' : 'items-start'}`}>
                  <div className={`max-w-[90%] rounded-2xl px-3.5 py-2.5 text-xs leading-relaxed whitespace-pre-line shadow-sm ${m.role === 'user' ? 'bg-[#800020] text-white font-semibold' : 'bg-white border border-gray-200 text-[#111111]'}`}>
                    {m.text}
                    {m.nutritionFocus && <div className="mt-2 pt-2 border-t border-gray-200 text-[11px] text-[#800020]"><strong>Nutrición:</strong> {m.nutritionFocus}</div>}
                  </div>
                  {m.plan && (
                    <div className="mt-2 w-full max-w-[92%] bg-white border border-[#800020]/40 rounded-2xl p-3 space-y-2 shadow-sm">
                      <div className="text-[11px] font-bold text-[#800020] flex items-center gap-1.5"><Calendar className="w-3.5 h-3.5" /> Propuesta Lista</div>
                      {m.plan.actionSummary && <p className="text-[11px] text-gray-700">{m.plan.actionSummary}</p>}
                      {m.plan.scheduleUpdates?.slice(0, 5).map((u, i) => {
                        const r = allRoutines.find((x) => x.id === u.routineId);
                        return <div key={i} className="text-[10px] bg-[#F8F9FA] border border-gray-200 rounded-lg px-2 py-1 text-gray-700 flex justify-between gap-2"><span className="font-bold text-[#111111] shrink-0">{u.date}</span><span className="truncate text-[#800020] font-semibold">{r?.name || u.routineId}</span></div>;
                      })}
                      <button
                        disabled={m.applied}
                        onClick={() => { onApplyPlan(m.plan); setMessages((prev) => prev.map((x, j) => (j === idx ? { ...x, applied: true } : x))); }}
                        className={`w-full py-2 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 ${m.applied ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-[#800020] text-white'}`}
                      >
                        {m.applied ? <><CheckCircle2 className="w-4 h-4" /> Aplicado</> : 'Aplicar Cambios al Calendario'}
                      </button>
                    </div>
                  )}
                </div>
              ))}
              {loading && <div className="flex items-center gap-2 text-xs text-[#800020] font-semibold px-2"><Sparkles className="w-4 h-4 animate-spin" /> Analizando tus datos...</div>}
            </div>

            <div className="p-3 border-t border-gray-200 bg-white space-y-2">
              <div className="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                {quickPrompts.map((qp, i) => (
                  <button key={i} onClick={() => handleSend(qp)} className="px-2.5 py-1.5 rounded-xl bg-[#F8F9FA] border border-gray-200 text-[10px] font-semibold text-[#111111] whitespace-nowrap hover:border-[#800020]">{qp}</button>
                ))}
              </div>
              <div className="flex items-center gap-2">
                <input type="text" value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') handleSend(); }} placeholder="Pídele algo a Gemini..." className="flex-1 bg-[#F8F9FA] border border-gray-300 rounded-2xl px-3.5 py-2.5 text-xs text-[#111111]" />
                <button onClick={() => handleSend()} disabled={!input.trim() || loading} className="p-2.5 rounded-2xl bg-[#800020] disabled:opacity-40 text-white"><Send className="w-4 h-4" /></button>
              </div>

          </div>
        </div>

    /* ============================================================================
     * 8. PANTALLA ACTIVA DE ENTRENAMIENTO (ActiveWorkoutView)
     * ========================================================================== */
    const ActiveWorkoutView = ({ routine, dateISO, completedSessions, deloadActive, onInspectExercise, onCompleteSession, onCancel }) => {
      const isTimedDefault = routine.discipline === 'mobility' || (routine.discipline === 'agility' && routine.exercises.every((e) => getExerciseById(e.exerciseId).unit === 'seg'));
      const [guidedMode, setGuidedMode] = useState(isTimedDefault);
      const [startTs] = useState(Date.now());

      const [exerciseLogs, setExerciseLogs] = useState(() =>
        routine.exercises.map((item) => {
          const prog = computeExerciseProgression(item.exerciseId, item, completedSessions, deloadActive);
          return {
            exerciseId: item.exerciseId,
            config: item,
            progression: prog,
            sets: Array.from({ length: item.sets }, () => ({
              weight: prog.suggestedWeight ?? (prog.lastSets?.[0]?.weight || 20),
              reps: prog.suggestedReps ?? item.minReps,
              rir: item.targetRir,
              done: false
            }))
          };
        })
      );

      const [restSecLeft, setRestSecLeft] = useState(0);
      const [restRunning, setRestRunning] = useState(false);
      const [restMinimized, setRestMinimized] = useState(false);

      const circuitSteps = useMemo(() => {
        const steps = [];
        routine.exercises.forEach((item) => {
          const ex = getExerciseById(item.exerciseId);
          const workSec = ex.unit === 'seg' ? item.maxReps : 40;
          const restSec = item.restSec || 15;
          for (let s = 1; s <= item.sets; s += 1) steps.push({ exercise: ex, setNum: s, totalSets: item.sets, workSec, restSec });
        });
        return steps;
      }, [routine]);

      const [circuitIdx, setCircuitIdx] = useState(0);
      const [circuitPhase, setCircuitPhase] = useState('work');
      const [circuitSec, setCircuitSec] = useState(circuitSteps[0]?.workSec || 40);
      const [circuitRunning, setCircuitRunning] = useState(false);

      const [showFinishModal, setShowFinishModal] = useState(false);
      const [rpe, setRpe] = useState(8);
      const [shoulderFatigue, setShoulderFatigue] = useState(2);
      const [kneeFatigue, setKneeFatigue] = useState(2);
      const [notes, setNotes] = useState('');

      useEffect(() => {
        if (!restRunning) return;
        const id = setInterval(() => {
          setRestSecLeft((prev) => { if (prev <= 1) { setRestRunning(false); playTimerBeep(); return 0; } return prev - 1; });
        }, 1000);
        return () => clearInterval(id);
      }, [restRunning]);

      useEffect(() => {
        if (!guidedMode || !circuitRunning) return;
        const id = setInterval(() => {
          setCircuitSec((prev) => {
            if (prev <= 1) {
              playTimerBeep();
              const current = circuitSteps[circuitIdx];
              if (circuitPhase === 'work' && current?.restSec > 0 && circuitIdx < circuitSteps.length - 1) { setCircuitPhase('rest'); return current.restSec; }
              if (circuitIdx + 1 < circuitSteps.length) { const nxt = circuitSteps[circuitIdx + 1]; setCircuitIdx(circuitIdx + 1); setCircuitPhase('work'); return nxt.workSec; }
              setCircuitRunning(false); setShowFinishModal(true); return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(id);
      }, [guidedMode, circuitRunning, circuitPhase, circuitIdx, circuitSteps]);

      const updateSetField = (exIdx, setIdx, field, val) => {
        setExerciseLogs((prev) => prev.map((ex, i) => (i !== exIdx ? ex : { ...ex, sets: ex.sets.map((st, j) => (j !== setIdx ? st : { ...st, [field]: Number(val) })) })));
      };

      const toggleSetDone = (exIdx, setIdx) => {
        const targetRest = exerciseLogs[exIdx]?.config?.restSec || 90;
        setExerciseLogs((prev) => prev.map((ex, i) => i !== exIdx ? ex : {
          ...ex,
          sets: ex.sets.map((st, j) => {
            if (j !== setIdx) return st;
            const nextDone = !st.done;
            if (nextDone && targetRest > 0) { setRestSecLeft(targetRest); setRestRunning(true); setRestMinimized(false); }
            return { ...st, done: nextDone };
          })
        }));
      };

      const addExtraSet = (exIdx) => {
        setExerciseLogs((prev) => prev.map((ex, i) => {
          if (i !== exIdx) return ex;
          const last = ex.sets[ex.sets.length - 1] || { weight: 20, reps: 10, rir: 2 };
          return { ...ex, sets: [...ex.sets, { weight: last.weight, reps: last.reps, rir: last.rir, done: false }] };
        }));
      };

      const handleSaveWorkout = () => {
        const durationMin = Math.max(12, Math.round((Date.now() - startTs) / 60000));
        const loggedExercises = exerciseLogs.map((ex) => ({ exerciseId: ex.exerciseId, sets: ex.sets.filter((s) => s.done).map(({ weight, reps, rir }) => ({ weight, reps, rir })) })).filter((ex) => ex.sets.length > 0);
        onCompleteSession({ id: `sess_${Date.now()}`, date: dateISO || TODAY_ISO, routineId: routine.id, routineName: routine.name, discipline: routine.discipline, durationMin: durationMin > 5 ? durationMin : routine.estimatedMin, rpe, shoulderFatigue, kneeFatigue, notes, exercises: loggedExercises });
      };

      const completedSetsCount = exerciseLogs.reduce((acc, e) => acc + e.sets.filter((s) => s.done).length, 0);
      const totalSetsCount = exerciseLogs.reduce((acc, e) => acc + e.sets.length, 0);
      const currentCircuit = circuitSteps[circuitIdx];

      return (
        <div className="min-h-screen bg-[#F7F7F8] text-[#111111] pb-28">
          <div className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-200 px-4 py-3 safe-pt">
            <div className="flex items-center justify-between gap-2 max-w-md mx-auto">
              <button onClick={onCancel} className="p-2 rounded-xl bg-gray-100 text-[#111111]"><ChevronLeft className="w-5 h-5" /></button>
              <div className="flex-1 min-w-0 text-center">
                <div className="text-[10px] font-bold uppercase tracking-wider text-[#800020]">Entrenamiento Activo · {formatHumanDate(dateISO)}</div>
                <h2 className="text-sm font-bold text-[#111111] truncate">{routine.name}</h2>
              </div>
              <button onClick={() => setShowFinishModal(true)} className="px-3 py-2 rounded-xl bg-[#800020] text-white text-xs font-extrabold">Finalizar</button>
            </div>

            <div className="max-w-md mx-auto mt-2.5 flex items-center justify-between gap-2">
              <div className="flex bg-gray-100 p-0.5 rounded-xl border border-gray-200 flex-1">
                <button onClick={() => setGuidedMode(false)} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${!guidedMode ? 'bg-[#800020] text-white' : 'text-gray-600'}`}>Registro Series ({completedSetsCount}/{totalSetsCount})</button>
                <button onClick={() => setGuidedMode(true)} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition ${guidedMode ? 'bg-[#111111] text-white' : 'text-gray-600'}`}>Circuito Guiado</button>
              </div>
              {deloadActive && <span className="text-[10px] font-bold px-2 py-1 rounded-lg bg-amber-50 text-amber-800 border border-amber-200">Descarga -10%</span>}
            </div>
          </div>

          <div className="max-w-md mx-auto px-4 pt-4">
            {guidedMode && currentCircuit ? (
              <div className="bg-white border border-gray-200 rounded-3xl p-4 shadow-sm">
                <div className="flex items-center justify-between text-xs text-gray-500 mb-2">
                  <span>Bloque {circuitIdx + 1} de {circuitSteps.length}</span>
                  <span className="px-2 py-0.5 rounded-full bg-[#FDF2F4] text-[#800020] font-bold">Serie {currentCircuit.setNum}/{currentCircuit.totalSets}</span>
                </div>
                <h3 className="text-lg font-bold text-[#111111] mb-1">{currentCircuit.exercise.name}</h3>
                <p className="text-xs text-gray-600 mb-3">{currentCircuit.exercise.cues?.[0]}</p>
                <div className="aspect-[260/170] w-full mb-4">
                  <ExerciseDiagramSVG diagramType={currentCircuit.exercise.diagramType} muscleHighlight={currentCircuit.exercise.muscleHighlight} mode="animate" badgeText={circuitPhase === 'work' ? 'TRABAJO ACTIVO' : 'DESCANSO / TRANSICIÓN'} />
                </div>
                <div className={`rounded-2xl p-4 text-center border mb-4 ${circuitPhase === 'work' ? 'bg-[#FDF2F4] border-[#800020]/30' : 'bg-[#F8F9FA] border-gray-200'}`}>
                  <div className="text-[11px] uppercase tracking-widest font-bold text-[#800020] mb-1">{circuitPhase === 'work' ? 'Ejecuta ahora' : 'Respira y prepara'}</div>
                  <div className="text-5xl font-black font-mono text-[#111111]">{String(Math.floor(circuitSec / 60)).padStart(2, '0')}:{String(circuitSec % 60).padStart(2, '0')}</div>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  <button onClick={() => { const p = Math.max(0, circuitIdx - 1); setCircuitIdx(p); setCircuitPhase('work'); setCircuitSec(circuitSteps[p].workSec); }} className="py-3 rounded-2xl bg-gray-100 text-[#111111] text-xs font-bold flex items-center justify-center gap-1"><ChevronLeft className="w-4 h-4" /> Ant</button>
                  <button onClick={() => setCircuitRunning((r) => !r)} className="py-3 rounded-2xl bg-[#800020] text-white text-xs font-extrabold flex items-center justify-center gap-1.5">{circuitRunning ? <Pause className="w-4 h-4" /> : <Play className="w-4 h-4 fill-current" />}{circuitRunning ? 'Pausar' : 'Iniciar'}</button>
                  <button onClick={() => { if (circuitIdx + 1 < circuitSteps.length) { const n = circuitIdx + 1; setCircuitIdx(n); setCircuitPhase('work'); setCircuitSec(circuitSteps[n].workSec); } else { setShowFinishModal(true); } }} className="py-3 rounded-2xl bg-gray-100 text-[#111111] text-xs font-bold flex items-center justify-center gap-1">Sig <ChevronRight className="w-4 h-4" /></button>
                </div>
              </div>
            ) : (
              <div className="space-y-4">
                {exerciseLogs.map((exLog, exIdx) => {
                  const exMeta = getExerciseById(exLog.exerciseId);
                  const bestSetE1RM = Math.max(0, ...exLog.sets.filter((s) => s.weight > 0 && s.reps > 0).map((s) => calcE1RM(s.weight, s.reps)));
                  const pillCls = exLog.progression.badgeColor === 'lime' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : exLog.progression.badgeColor === 'amber' ? 'bg-amber-50 text-amber-800 border-amber-200' : 'bg-[#FDF2F4] text-[#800020] border-[#F3C6D0]';
                  return (
                    <div key={`${exLog.exerciseId}-${exIdx}`} className="bg-white border border-gray-200 rounded-3xl p-4 shadow-sm">
                      <div className="flex items-start gap-3 mb-3">
                        <button onClick={() => onInspectExercise(exMeta)} className="w-16 h-11 shrink-0 rounded-xl overflow-hidden border border-gray-200 hover:border-[#800020] transition">
                          <ExerciseDiagramSVG diagramType={exMeta.diagramType} muscleHighlight={exMeta.muscleHighlight} mode="peak" compact />
                        </button>
                        <div className="flex-1 min-w-0">
                          <button onClick={() => onInspectExercise(exMeta)} className="text-left text-sm font-bold text-[#111111] hover:text-[#800020] transition flex items-center gap-1.5">
                            <span className="truncate">{exIdx + 1}. {exMeta.name}</span><Eye className="w-3.5 h-3.5 text-[#800020] shrink-0" />
                          </button>
                          <div className="text-[11px] text-gray-500 mt-0.5">Objetivo: {exLog.config.minReps}–{exLog.config.maxReps} {exMeta.unit === 'seg' ? 's' : 'reps'} · RIR {exLog.config.targetRir} · Descanso {exLog.config.restSec}s</div>
                        </div>
                        {bestSetE1RM > 0 && exMeta.unit === 'kg' && (
                          <div className="text-right shrink-0"><div className="text-[9px] uppercase text-gray-400">e1RM</div><div className="text-xs font-extrabold text-[#800020]">{bestSetE1RM} kg</div></div>
                        )}
                      </div>

                      <div className={`text-[11px] px-3 py-2 rounded-xl border mb-3 flex items-center gap-2 font-medium ${pillCls}`}><Zap className="w-3.5 h-3.5 shrink-0" /><span>{exLog.progression.suggestionText}</span></div>
                      <div className="grid grid-cols-12 gap-1.5 text-[10px] font-bold text-gray-400 uppercase px-1 mb-1.5">
                        <div className="col-span-2 text-center">Serie</div><div className="col-span-4 text-center">{exMeta.unit === 'kg' ? 'Peso (kg)' : 'Carga'}</div><div className="col-span-3 text-center">{exMeta.unit === 'seg' ? 'Seg' : exMeta.unit === 'm' ? 'Metros' : 'Reps'}</div><div className="col-span-1 text-center">RIR</div><div className="col-span-2 text-center">Ok</div>
                      </div>
                      <div className="space-y-2">
                        {exLog.sets.map((st, setIdx) => (
                          <div key={setIdx} className={`grid grid-cols-12 gap-1.5 items-center p-1.5 rounded-2xl border transition ${st.done ? 'bg-[#FDF2F4] border-[#800020]/35' : 'bg-[#F8F9FA] border-gray-200'}`}>
                            <div className="col-span-2 text-center text-xs font-bold text-gray-600">#{setIdx + 1}</div>
                            <div className="col-span-4"><input type="number" step="0.5" value={st.weight} onChange={(e) => updateSetField(exIdx, setIdx, 'weight', e.target.value)} className="w-full bg-white border border-gray-300 rounded-xl py-1.5 px-2 text-center text-xs font-bold text-[#111111]" /></div>
                            <div className="col-span-3"><input type="number" value={st.reps} onChange={(e) => updateSetField(exIdx, setIdx, 'reps', e.target.value)} className="w-full bg-white border border-gray-300 rounded-xl py-1.5 px-1.5 text-center text-xs font-bold text-[#111111]" /></div>
                            <div className="col-span-1 text-center"><button onClick={() => updateSetField(exIdx, setIdx, 'rir', st.rir >= 4 ? 0 : st.rir + 1)} className="w-full py-1.5 rounded-lg bg-white border border-gray-300 text-[11px] font-bold text-[#800020]">{st.rir}</button></div>
                            <div className="col-span-2 flex justify-center"><button onClick={() => toggleSetDone(exIdx, setIdx)} className={`w-9 h-8 rounded-xl flex items-center justify-center transition ${st.done ? 'bg-[#800020] text-white' : 'bg-white border border-gray-300 text-gray-400'}`}><Check className="w-4 h-4 stroke-[3]" /></button></div>
                          </div>
                        ))}
                      </div>
                      <button onClick={() => addExtraSet(exIdx)} className="mt-2.5 w-full py-1.5 rounded-xl bg-[#F8F9FA] border border-dashed border-gray-300 text-[11px] font-semibold text-gray-600 hover:text-[#111111]">+ Añadir serie extra</button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {(restRunning || restSecLeft > 0) && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 w-[92%] max-w-md bg-white/95 backdrop-blur-md border-2 border-[#800020] rounded-2xl p-3 shadow-xl">
              <div className="flex items-center justify-between gap-3">
                <div className="flex items-center gap-2.5">
                  <div className="w-9 h-9 rounded-xl bg-[#FDF2F4] text-[#800020] flex items-center justify-center"><Timer className="w-5 h-5" /></div>
                  <div>
                    <div className="text-[10px] uppercase tracking-wider text-gray-500 font-semibold">Descanso</div>
                    <div className="text-xl font-black font-mono text-[#111111] leading-none">{String(Math.floor(restSecLeft / 60)).padStart(2, '0')}:{String(restSecLeft % 60).padStart(2, '0')}</div>
                  </div>
                </div>
                {!restMinimized && (
                  <div className="flex items-center gap-1.5">
                    <button onClick={() => setRestSecLeft((s) => Math.max(0, s - 15))} className="px-2.5 py-1.5 rounded-xl bg-gray-100 text-xs font-bold text-[#111111]">-15s</button>
                    <button onClick={() => setRestSecLeft((s) => s + 15)} className="px-2.5 py-1.5 rounded-xl bg-gray-100 text-xs font-bold text-[#111111]">+15s</button>
                    <button onClick={() => setRestRunning((r) => !r)} className="p-2 rounded-xl bg-[#800020] text-white">{restRunning ? <Pause className="w-4 h-4" /> : <Play className="w-4 h-4 fill-current" />}</button>
                    <button onClick={() => { setRestRunning(false); setRestSecLeft(0); }} className="p-2 rounded-xl bg-gray-100 text-gray-600"><X className="w-4 h-4" /></button>
                  </div>
                )}
                <button onClick={() => setRestMinimized((m) => !m)} className="p-1.5 text-gray-500">{restMinimized ? <Maximize2 className="w-4 h-4" /> : <Minimize2 className="w-4 h-4" />}</button>
              </div>
            </div>
          )}

          {showFinishModal && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="w-full max-w-md bg-white border border-gray-200 rounded-t-3xl sm:rounded-3xl p-5 text-[#111111]">
                <h3 className="text-lg font-bold text-[#111111] mb-1">Cerrar Sesión & Evaluar Carga</h3>
                <p className="text-xs text-gray-500 mb-4">Estos datos alimentan el detector de fatiga y tus 5 pilares.</p>
                <div className="space-y-4 mb-5">
                  <div>
                    <div className="flex justify-between text-xs mb-1"><span className="text-gray-700 font-semibold">Esfuerzo Global (RPE 1–10)</span><span className="text-[#800020] font-bold">{rpe}/10</span></div>
                    <input type="range" min="1" max="10" step="0.5" value={rpe} onChange={(e) => setRpe(Number(e.target.value))} className="w-full accent-[#800020]" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-[#F8F9FA] border border-gray-200 rounded-2xl p-3">
                      <div className="text-[11px] font-semibold text-gray-600 mb-1">Estrés Hombro (1-5)</div>
                      <div className="flex gap-1">{[1, 2, 3, 4, 5].map((v) => <button key={v} onClick={() => setShoulderFatigue(v)} className={`flex-1 py-1.5 rounded-lg text-xs font-bold ${shoulderFatigue === v ? 'bg-[#800020] text-white' : 'bg-white border border-gray-200 text-gray-700'}`}>{v}</button>)}</div>
                    </div>
                    <div className="bg-[#F8F9FA] border border-gray-200 rounded-2xl p-3">
                      <div className="text-[11px] font-semibold text-gray-600 mb-1">Estrés Rodilla (1-5)</div>
                      <div className="flex gap-1">{[1, 2, 3, 4, 5].map((v) => <button key={v} onClick={() => setKneeFatigue(v)} className={`flex-1 py-1.5 rounded-lg text-xs font-bold ${kneeFatigue === v ? 'bg-[#111111] text-white' : 'bg-white border border-gray-200 text-gray-700'}`}>{v}</button>)}</div>
                    </div>
                  </div>
                  <textarea rows={2} placeholder="Notas opcionales..." value={notes} onChange={(e) => setNotes(e.target.value)} className="w-full bg-white border border-gray-300 rounded-xl p-3 text-xs text-[#111111]" />
                </div>
                <div className="grid grid-cols-2 gap-2.5">
                  <button onClick={() => setShowFinishModal(false)} className="py-3 rounded-2xl bg-gray-100 text-[#111111] text-xs font-bold">Seguir dentro</button>
                  <button onClick={handleSaveWorkout} className="py-3 rounded-2xl bg-[#800020] text-white text-xs font-extrabold">Guardar Sesión</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ============================================================================
     * 9. PESTAÑAS PRINCIPALES (ESTADO, AGENDA, DIETA, RUTINAS, EJERCICIOS, PLAN)
     * ========================================================================== */
    const StatusTab = ({ bodyCheckins, athleteSex, onToggleSex, onSaveCheckin, onDeleteCheckin, completedSessions, allRoutines, onSelectRoutine, notifPermission, onRequestNotif }) => {
      const sortedCheckins = useMemo(() => bodyCheckins.slice().sort((a, b) => b.date.localeCompare(a.date)), [bodyCheckins]);
      const latest = sortedCheckins[0] || createInitialBodyCheckins()[2];
      const previous = sortedCheckins[1] || null;
      const baseline = sortedCheckins[sortedCheckins.length - 1] || latest;

      const isTodaySun = isSundayISO(TODAY_ISO);
      const checkedToday = sortedCheckins.some((c) => c.date === TODAY_ISO);
      const daysToSun = daysUntilNextSunday(TODAY_ISO);

      const [showForm, setShowForm] = useState(isTodaySun && !checkedToday);
      const [chartMetric, setChartMetric] = useState('weight');
      const [saveToast, setSaveToast] = useState('');

      const [form, setForm] = useState(() => ({
        date: TODAY_ISO, weight: latest.weight, height: latest.height, neck: latest.neck, shoulders: latest.shoulders, chest: latest.chest, waist: latest.waist, hip: latest.hip,
        bicepL: latest.bicepL, bicepR: latest.bicepR, forearmL: latest.forearmL ?? 29.2, forearmR: latest.forearmR ?? 29.7, thighL: latest.thighL, thighR: latest.thighR, calfL: latest.calfL, calfR: latest.calfR,
        manualBfPct: latest.manualBfPct || 0, notes: ''
      }));

      useEffect(() => {
        setForm((prev) => ({
          ...prev, weight: latest.weight, height: latest.height, neck: latest.neck, shoulders: latest.shoulders, chest: latest.chest, waist: latest.waist, hip: latest.hip,
          bicepL: latest.bicepL, bicepR: latest.bicepR, forearmL: latest.forearmL ?? 29.2, forearmR: latest.forearmR ?? 29.7, thighL: latest.thighL, thighR: latest.thighR, calfL: latest.calfL, calfR: latest.calfR
        }));
      }, [latest]);

      const comp = useMemo(() => calcBodyComposition(latest, athleteSex), [latest, athleteSex]);
      const prevComp = useMemo(() => (previous ? calcBodyComposition(previous, athleteSex) : null), [previous, athleteSex]);
      const prop = useMemo(() => calcBodyProportions(latest), [latest]);
      const pillars = useMemo(() => calcHybridPillarsScore(latest, baseline, completedSessions, athleteSex), [latest, baseline, completedSessions, athleteSex]);

      const handleField = (k, val) => setForm((p) => ({ ...p, [k]: val }));

      const submitForm = (e) => {
        e.preventDefault();
        onSaveCheckin({
          id: `chk_${Date.now()}`, date: form.date || TODAY_ISO,
          weight: Number(form.weight) || 0, height: Number(form.height) || 178, neck: Number(form.neck) || 38, shoulders: Number(form.shoulders) || 115, chest: Number(form.chest) || 100, waist: Number(form.waist) || 82, hip: Number(form.hip) || 95,
          bicepL: Number(form.bicepL) || 35, bicepR: Number(form.bicepR) || 35, forearmL: Number(form.forearmL) || 29, forearmR: Number(form.forearmR) || 29, thighL: Number(form.thighL) || 55, thighR: Number(form.thighR) || 55, calfL: Number(form.calfL) || 36, calfR: Number(form.calfR) || 36,
          manualBfPct: Number(form.manualBfPct) || 0, notes: form.notes.trim()
        });
        setShowForm(false);
        setSaveToast('¡Medidas guardadas y evaluación de cuerpo equilibrado actualizada!');
        setTimeout(() => setSaveToast(''), 4000);
      };

      const coachingAdvice = useMemo(() => {
        const weakestPillar = pillars.slice().sort((a, b) => a.score - b.score)[0];
        const maxAsym = prop.symmetries.slice().sort((a, b) => b.diff - a.diff)[0];
        const suggestedIds = [];
        if (maxAsym && maxAsym.diff >= 0.8) suggestedIds.push('simetria_cuerpo_equilibrado');
        if (weakestPillar?.key === 'flexibility') suggestedIds.push('flexibilidad_movilidad_global');
        else if (weakestPillar?.key === 'explosiveness') suggestedIds.push('explosividad_potencia_total');
        else if (weakestPillar?.key === 'agility') suggestedIds.push('agilidad_reactiva_circuito');
        else if (weakestPillar?.key === 'bodyComp') suggestedIds.push('recomp_metabolica_hibrida');
        else suggestedIds.push('torso_a');
        return { weakestPillar, maxAsym, recommendedRoutine: allRoutines.find((r) => r.id === suggestedIds[0]) || allRoutines[0] };
      }, [pillars, prop, allRoutines]);

      const chartPoints = useMemo(() => {
        const chrono = sortedCheckins.slice().reverse();
        return chrono.map((c) => {
          const cComp = calcBodyComposition(c, athleteSex);
          const cProp = calcBodyProportions(c);
          let val = c.weight;
          if (chartMetric === 'waist') val = c.waist;
          else if (chartMetric === 'bfPct') val = cComp.bfPct;
          else if (chartMetric === 'shoulders') val = c.shoulders;
          else if (chartMetric === 'avgThigh') val = cProp.avgThigh;
          else if (chartMetric === 'avgBicep') val = cProp.avgBicep;
          return { date: c.date.slice(5), val: Number(val) };
        });
      }, [sortedCheckins, chartMetric, athleteSex]);

      const deltaText = (curr, prev, unit = '', invertGood = false) => {
        if (prev == null) return null;
        const d = Math.round((curr - prev) * 10) / 10;
        if (d === 0) return <span className="text-[10px] text-gray-400">(=)</span>;
        const isGood = invertGood ? d < 0 : d > 0;
        return <span className={`text-[10px] font-bold ${isGood ? 'text-emerald-700' : 'text-amber-700'}`}>{d > 0 ? `+${d}` : d}{unit}</span>;
      };

      const radarGeometry = useMemo(() => {
        const cx = 130; const cy = 112; const maxR = 72;
        const angles = pillars.map((_, idx) => -Math.PI / 2 + (idx * 2 * Math.PI) / pillars.length);
        const gridPolygons = [0.25, 0.5, 0.75, 1].map((scale) => angles.map((a) => `${cx + maxR * scale * Math.cos(a)},${cy + maxR * scale * Math.sin(a)}`).join(' '));
        const dataPoints = pillars.map((p, i) => { const r = (p.score / 100) * maxR; return [cx + r * Math.cos(angles[i]), cy + r * Math.sin(angles[i])]; });
        const dataPolygon = dataPoints.map((pt) => pt.join(',')).join(' ');
        const labels = pillars.map((p, i) => ({ ...p, x: cx + (maxR + 22) * Math.cos(angles[i]), y: cy + (maxR + 18) * Math.sin(angles[i]), pt: dataPoints[i] }));
        return { cx, cy, maxR, angles, gridPolygons, dataPolygon, labels };
      }, [pillars]);

      return (
        <div className="space-y-4 pb-6">
          <div className={`rounded-3xl p-4 border shadow-sm transition ${isTodaySun && !checkedToday ? 'bg-[#FDF2F4] border-[#800020]/50' : checkedToday && isTodaySun ? 'bg-emerald-50 border-emerald-200' : 'bg-white border-gray-200'}`}>
            <div className="flex items-start gap-3">
              <div className={`w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 ${isTodaySun && !checkedToday ? 'bg-[#800020] text-white animate-pulse' : 'bg-[#FDF2F4] text-[#800020]'}`}><Bell className="w-5 h-5" /></div>
              <div>
                <div className="text-xs font-extrabold uppercase tracking-wider text-[#800020]">
                  {isTodaySun && !checkedToday ? '¡Hoy es Domingo! Check-in de Medidas' : isTodaySun && checkedToday ? 'Check-in Dominical Completado' : `Próximo Check-in: Domingo (en ${daysToSun}d)`}
                </div>
                <p className="text-xs text-gray-600 mt-0.5 leading-relaxed">
                  {isTodaySun && !checkedToday ? 'Tómate las medidas en ayunas para evaluar tu cuerpo equilibrado.' : checkedToday && isTodaySun ? 'Tus medidas de hoy ya están registradas y comparadas.' : 'Cada domingo recibirás el recordatorio para registrar tu evolución corporal.'}
                </p>
              </div>
            </div>
            <div className="flex flex-wrap gap-2 mt-3">
              <button onClick={() => setShowForm((s) => !s)} className="flex-1 min-w-[140px] py-2.5 px-3 rounded-xl bg-[#800020] hover:bg-[#66001A] text-white text-xs font-extrabold flex items-center justify-center gap-1.5">
                <Ruler className="w-4 h-4" />{showForm ? 'Ocultar Formulario' : isTodaySun && !checkedToday ? 'Registrar Medidas Hoy' : 'Añadir Nueva Medición'}
              </button>
              <button onClick={downloadSundayIcsReminder} className="py-2.5 px-3 rounded-xl bg-[#F8F9FA] border border-gray-300 text-[#111111] text-xs font-semibold flex items-center gap-1.5">
