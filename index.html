                <button onClick={() => onChangeWeek(Math.max(1, blockWeek - 1))} className="p-1.5 rounded-lg bg-gray-100 text-[#111111]"><Minus className="w-3.5 h-3.5" /></button>
                <button onClick={() => onChangeWeek(Math.min(8, blockWeek + 1))} className="p-1.5 rounded-lg bg-gray-100 text-[#111111]"><Plus className="w-3.5 h-3.5" /></button>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2 mb-3">
              {ANNUAL_BLOCKS.map((b) => (
                <button key={b.id} onClick={() => onChangeBlock(b.id)} className={`text-left p-2.5 rounded-2xl border transition ${currentBlockId === b.id ? 'bg-[#FDF2F4] border-[#800020] text-[#111111]' : 'bg-[#F8F9FA] border-gray-200 text-gray-600'}`}>
                  <div className="text-[10px] font-bold text-[#800020]">{b.weeks}</div>
                  <div className="text-xs font-bold truncate">{b.name.replace(/^Bloque \d+ — /, '')}</div>
                  <div className="text-[10px] text-gray-500">{b.repRange} · RIR {b.targetRir}</div>
                </button>
              ))}
            </div>
            <div className="bg-[#F8F9FA] border border-gray-200 rounded-2xl p-3">
              <div className="text-xs font-bold text-[#800020] mb-1">{activeBlock.name}</div>
              <p className="text-[11px] text-gray-700 mb-2">{activeBlock.focus}</p>
              <div className="flex flex-wrap gap-1.5">
                {activeBlock.recommendedRoutines.map((rid) => {
                  const r = allRoutines.find((x) => x.id === rid); if (!r) return null;
                  return <button key={rid} onClick={() => onPreviewRoutine(r)} className="text-[10px] font-semibold px-2.5 py-1 rounded-lg bg-white border border-gray-200 text-[#111111] hover:border-[#800020] hover:text-[#800020]">{r.name.split('—')[0]}</button>;
                })}
              </div>
            </div>
          </div>

          <div className="bg-white border border-gray-200 rounded-3xl p-4 shadow-sm">
            <div className="flex items-center justify-between gap-2 mb-3">
              <h3 className="text-sm font-bold text-[#111111]">Curva e1RM Estimado</h3>
              <select value={selectedExId} onChange={(e) => setSelectedExId(e.target.value)} className="bg-[#F8F9FA] border border-gray-300 rounded-xl px-2 py-1.5 text-[11px] text-[#800020] font-bold max-w-[175px]">
                {EXERCISES_DB.filter((e) => e.unit === 'kg').map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
            </div>
            {e1rmHistory.length >= 1 ? (
              <svg viewBox="0 0 300 100" className="w-full h-24 bg-[#FAFAFA] rounded-2xl border border-gray-200">
                {(() => {
                  const vals = e1rmHistory.map((p) => p.val); const min = Math.min(...vals) - 2; const max = Math.max(...vals) + 2; const span = Math.max(1, max - min);
                  const pts = e1rmHistory.map((p, idx) => ({ x: e1rmHistory.length === 1 ? 150 : 28 + (idx * 244) / (e1rmHistory.length - 1), y: 72 - ((p.val - min) / span) * 48, ...p }));
                  return (
                    <>
                      {pts.length > 1 && <polyline points={pts.map((p) => `${p.x},${p.y}`).join(' ')} fill="none" stroke="#800020" strokeWidth="2.5" />}
                      {pts.map((p, i) => <g key={i}><circle cx={p.x} cy={p.y} r="4" fill="#800020" /><text x={p.x} y={p.y - 8} textAnchor="middle" fill="#111111" fontSize="9" fontWeight="bold">{p.val}kg</text><text x={p.x} y="92" textAnchor="middle" fill="#6B7280" fontSize="8">{p.date}</text></g>)}
                    </>
                  );
                })()}
              </svg>
            ) : <div className="text-xs text-gray-500 bg-[#F8F9FA] rounded-2xl p-3 text-center">Registra una serie en este ejercicio para ver tu e1RM.</div>}
          </div>

          <div className="bg-white border border-gray-200 rounded-3xl p-4 space-y-3 shadow-sm">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2"><Cloud className="w-4 h-4 text-[#800020]" /><span className="text-xs font-bold text-[#111111]">Guardado & Respaldo</span></div>
              <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#FDF2F4] text-[#800020] font-bold">{syncStatus}</span>
            </div>
            {userId && <div className="text-[10px] text-gray-500 break-all">ID Usuario: {userId}</div>}
            <div className="grid grid-cols-2 gap-2">
              <button onClick={onExportJSON} className="py-2.5 px-3 rounded-xl bg-gray-100 text-[#111111] text-xs font-semibold flex items-center justify-center gap-1.5"><Download className="w-3.5 h-3.5" /> Exportar JSON</button>
              <label className="py-2.5 px-3 rounded-xl bg-gray-100 text-[#111111] text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer"><Upload className="w-3.5 h-3.5" /> Importar JSON<input type="file" accept=".json" onChange={onImportJSON} className="hidden" /></label>
            </div>
            <button onClick={onCopyGeminiSnapshot} className="w-full py-2.5 px-3 rounded-xl bg-[#FDF2F4] border border-[#F3C6D0] text-xs font-bold text-[#800020] flex items-center justify-center gap-1.5"><Copy className="w-3.5 h-3.5" /> Copiar Resumen para Pegar en Chat Gemini</button>
          </div>
        </div>
      );
    };

    const NutritionTab = ({ athleteSex, athleteAge, onChangeAge, nutritionGoal, onChangeGoal, activityLevel, onChangeActivity, bodyCheckins, completedSessions, scheduledWorkouts, allRoutines, nutritionLogs, customGeminiKey, onAddMealLog, onDeleteMealLog }) => {
      const [selectedDate, setSelectedDate] = useState(TODAY_ISO);
      const [showMetaSettings, setShowMetaSettings] = useState(false);
      const [mealSlot, setMealSlot] = useState('Comida Oficina');
      const [mealText, setMealText] = useState('');
      const [photoData, setPhotoData] = useState(null);
      const [estimating, setEstimating] = useState(false);
      const [estimateErr, setEstimateErr] = useState('');
      const [pendingEstimate, setPendingEstimate] = useState(null);
      const [portionScale, setPortionScale] = useState(1);
      const [ideaFilter, setIdeaFilter] = useState('Todas');
      const [expandedIdeaId, setExpandedIdeaId] = useState(null);

      const sortedCheckins = useMemo(() => bodyCheckins.slice().sort((a, b) => b.date.localeCompare(a.date)), [bodyCheckins]);
      const targets = useMemo(() => calcDailyNutritionTargets({ latestMeasure: sortedCheckins[0], previousMeasure: sortedCheckins[1], firstMeasure: sortedCheckins[sortedCheckins.length - 1], athleteSex, athleteAge, nutritionGoal, activityLevel, targetDateISO: selectedDate, completedSessions, scheduledWorkouts, allRoutines }), [sortedCheckins, athleteSex, athleteAge, nutritionGoal, activityLevel, selectedDate, completedSessions, scheduledWorkouts, allRoutines]);
      const dayLogs = useMemo(() => nutritionLogs.filter((l) => l.date === selectedDate), [nutritionLogs, selectedDate]);
      const consumed = useMemo(() => dayLogs.reduce((acc, l) => ({ kcal: acc.kcal + (Number(l.kcal) || 0), protein: acc.protein + (Number(l.protein) || 0), carbs: acc.carbs + (Number(l.carbs) || 0), fat: acc.fat + (Number(l.fat) || 0) }), { kcal: 0, protein: 0, carbs: 0, fat: 0 }), [dayLogs]);

      const kcalLeft = targets.targetKcal - consumed.kcal;
      const proteinLeft = Math.max(0, targets.proteinG - consumed.protein);
      const kcalPct = Math.min(100, Math.round((consumed.kcal / Math.max(1, targets.targetKcal)) * 100));
      const proteinPct = Math.min(100, Math.round((consumed.protein / Math.max(1, targets.proteinG)) * 100));

      const handlePhotoUpload = async (e) => {
        const file = e.target.files?.[0]; e.target.value = ''; if (!file) return; setEstimateErr('');
        try { const compressed = await compressImageToBase64(file, 800); setPhotoData(compressed); }
        catch (err) { setEstimateErr('No se pudo procesar la imagen. Descríbela en texto.'); }
      };

      const callGeminiVisionNutrition = async () => {
        if (!photoData && !mealText.trim()) return;
        setEstimating(true); setEstimateErr(''); setPortionScale(1);
        const promptText = [
          'Eres un nutricionista deportivo práctico en España. Analiza la comida (imagen y/o texto) y estima calorías y macronutrientes totales de forma realista.',
          `Contexto: adulto de ${athleteAge} años. Descripción: "${mealText.trim() || 'Ver foto adjunta'}".`,
          'Devuelve JSON con mealName, estimatedKcal, proteinG, carbsG, fatG, ingredientsSummary y tip breve.'
        ].join('\n');

        const parts = [{ text: promptText }];
        if (photoData?.base64) parts.push({ inlineData: { mimeType: photoData.mimeType, data: photoData.base64 } });
        const payload = {
          contents: [{ role: 'user', parts }],
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: { mealName: { type: 'STRING' }, estimatedKcal: { type: 'INTEGER' }, proteinG: { type: 'INTEGER' }, carbsG: { type: 'INTEGER' }, fatG: { type: 'INTEGER' }, ingredientsSummary: { type: 'STRING' }, tip: { type: 'STRING' } }
            }
          }
        };

        const apiKey = customGeminiKey || '';
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        try {
          const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const parsed = JSON.parse(data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}');
          setPendingEstimate({
            baseKcal: Math.max(20, Number(parsed.estimatedKcal) || 400), baseProtein: Math.max(0, Number(parsed.proteinG) || 25), baseCarbs: Math.max(0, Number(parsed.carbsG) || 35), baseFat: Math.max(0, Number(parsed.fatG) || 14),
            name: parsed.mealName || mealText.trim() || 'Comida analizada por foto', kcal: Math.max(20, Number(parsed.estimatedKcal) || 400), protein: Math.max(0, Number(parsed.proteinG) || 25), carbs: Math.max(0, Number(parsed.carbsG) || 35), fat: Math.max(0, Number(parsed.fatG) || 14),
            ingredientsSummary: parsed.ingredientsSummary || '', tip: parsed.tip || ''
          });
        } catch (err) {
          const local = estimateMealLocally(mealText);
          setPendingEstimate({
            baseKcal: local.estimatedKcal, baseProtein: local.proteinG, baseCarbs: local.carbsG, baseFat: local.fatG,
            name: local.mealName, kcal: local.estimatedKcal, protein: local.proteinG, carbs: local.carbsG, fat: local.fatG,
            ingredientsSummary: local.ingredientsSummary, tip: local.tip
          });
          setEstimateErr('Estimación local aplicada (editable). Para visión por foto fuera del chat, guarda tu API Key Gemini en Descargar > Ajustes.');
        } finally {
          setEstimating(false);
        }
      };

      const applyPortionScale = (scale) => {
        setPortionScale(scale);
        if (!pendingEstimate) return;
        setPendingEstimate((p) => ({ ...p, kcal: Math.round(p.baseKcal * scale), protein: Math.round(p.baseProtein * scale), carbs: Math.round(p.baseCarbs * scale), fat: Math.round(p.baseFat * scale) }));
      };

      const confirmPendingMeal = () => {
        if (!pendingEstimate) return;
        onAddMealLog({ id: `meal_${Date.now()}`, date: selectedDate, slot: mealSlot, name: pendingEstimate.name, kcal: Number(pendingEstimate.kcal) || 0, protein: Number(pendingEstimate.protein) || 0, carbs: Number(pendingEstimate.carbs) || 0, fat: Number(pendingEstimate.fat) || 0, source: photoData ? 'photo_ai' : 'text_ai' });
        setPendingEstimate(null); setPhotoData(null); setMealText('');
      };

      const filteredIdeas = MEAL_IDEAS_DB.filter((m) => ideaFilter === 'Todas' || m.slot === ideaFilter);

      return (
        <div className="space-y-4 pb-6">
          <div className="bg-white border border-gray-200 rounded-3xl p-4 shadow-sm space-y-3">
            <div className="flex items-start justify-between gap-2">
              <div><span className="text-[10px] font-bold uppercase tracking-wider text-[#800020]">Nutrición 80/20 · {targets.goalLabel}</span><h2 className="text-base font-bold text-[#111111]">{selectedDate === TODAY_ISO ? 'Tus Macros de Hoy' : formatHumanDate(selectedDate)}</h2></div>
              <div className="flex items-center gap-1.5">
                <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="bg-[#F8F9FA] border border-gray-200 rounded-xl px-2 py-1.5 text-[11px] font-semibold text-[#111111]" />
                <button onClick={() => setShowMetaSettings((s) => !s)} className="p-2 rounded-xl bg-[#FDF2F4] border border-[#F3C6D0] text-[#800020]"><Sliders className="w-4 h-4" /></button>
              </div>
            </div>

            <div className="bg-[#F8F9FA] border border-gray-200 rounded-2xl p-2.5 space-y-1">
              <div className="text-[11px] font-bold text-[#111111] flex items-center gap-1.5"><Zap className="w-3.5 h-3.5 text-[#800020] shrink-0" /><span className="truncate">{targets.workoutLabel}</span></div>
              <div className="text-[10px] text-gray-600 flex items-center gap-1.5"><Scale className="w-3 h-3 text-[#800020] shrink-0" /><span>{targets.adaptiveReason}</span></div>
            </div>

            {showMetaSettings && (
              <div className="bg-[#FDF2F4]/60 border border-[#F3C6D0] rounded-2xl p-3 space-y-3">
                <div>
                  <div className="text-[10px] font-bold uppercase text-[#800020] mb-1.5">Objetivo Nutricional</div>
                  <div className="grid grid-cols-2 gap-1.5">
                    {NUTRITION_GOALS.map((g) => (
                      <button key={g.id} onClick={() => onChangeGoal(g.id)} className={`p-2 rounded-xl border text-left transition ${nutritionGoal === g.id ? 'bg-[#800020] text-white border-[#800020]' : 'bg-white text-[#111111] border-gray-200'}`}>
                        <div className="text-xs font-bold">{g.label}</div><div className={`text-[10px] ${nutritionGoal === g.id ? 'text-white/80' : 'text-gray-500'}`}>{g.short}</div>
                      </button>
                    ))}
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block text-[10px] font-semibold text-gray-600 mb-1">Edad (años)</label><input type="number" min="18" max="80" value={athleteAge} onChange={(e) => onChangeAge(Number(e.target.value) || 36)} className="w-full bg-white border border-gray-300 rounded-xl px-2.5 py-1.5 text-xs font-bold text-[#111111]" /></div>
                  <div><label className="block text-[10px] font-semibold text-gray-600 mb-1">Actividad Diaria</label><select value={activityLevel} onChange={(e) => onChangeActivity(e.target.value)} className="w-full bg-white border border-gray-300 rounded-xl px-2 py-1.5 text-xs font-bold text-[#111111]"><option value="office">Oficina (8h sentado)</option><option value="active_job">Trabajo activo</option><option value="sedentary">Muy sedentario</option></select></div>
                </div>
              </div>
            )}

            <div className="grid grid-cols-2 gap-2.5">
              <div className="bg-[#FDF2F4] border border-[#F3C6D0] rounded-2xl p-3">
                <div className="flex items-center justify-between text-[10px] font-bold text-[#800020] uppercase mb-1"><span>Calorías</span><span>{kcalPct}%</span></div>
                <div className="text-lg font-black text-[#111111] leading-none">{consumed.kcal} <span className="text-xs font-semibold text-gray-500">/ {targets.targetKcal}</span></div>
                <div className="w-full h-2 bg-white rounded-full overflow-hidden mt-2 mb-1.5 border border-[#F3C6D0]"><div className={`h-full rounded-full transition-all ${kcalLeft < -150 ? 'bg-amber-600' : 'bg-[#800020]'}`} style={{ width: `${kcalPct}%` }} /></div>
                <div className="text-[10px] font-semibold text-gray-700">{kcalLeft >= 0 ? `Te quedan ${kcalLeft} kcal` : `+${Math.abs(kcalLeft)} kcal extra`}</div>
              </div>
              <div className="bg-[#F8F9FA] border border-gray-200 rounded-2xl p-3">
                <div className="flex items-center justify-between text-[10px] font-bold text-[#111111] uppercase mb-1"><span>Proteína</span><span>{proteinPct}%</span></div>
                <div className="text-lg font-black text-[#111111] leading-none">{consumed.protein}g <span className="text-xs font-semibold text-gray-500">/ {targets.proteinG}g</span></div>
                <div className="w-full h-2 bg-gray-200 rounded-full overflow-hidden mt-2 mb-1.5"><div className="h-full bg-[#111111] rounded-full transition-all" style={{ width: `${proteinPct}%` }} /></div>
                <div className="text-[10px] font-semibold text-gray-700">{proteinLeft > 0 ? `Faltan ${proteinLeft}g hoy` : '¡Objetivo cubierto!'}</div>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2 text-[11px]">
              <div className="bg-[#F8F9FA] border border-gray-200 rounded-xl px-3 py-1.5 flex items-center justify-between"><span className="text-gray-500">Carbos</span><span className="font-bold text-[#111111]">{consumed.carbs} / {targets.carbsG}g</span></div>
              <div className="bg-[#F8F9FA] border border-gray-200 rounded-xl px-3 py-1.5 flex items-center justify-between"><span className="text-gray-500">Grasas</span><span className="font-bold text-[#111111]">{consumed.fat} / {targets.fatG}g</span></div>
            </div>
          </div>

          <div className="bg-white border border-gray-200 rounded-3xl p-4 shadow-sm space-y-3">
            <div className="flex items-center justify-between">
              <div><h3 className="text-sm font-bold text-[#111111]">Contador Rápido (Foto o Texto)</h3><p className="text-[11px] text-gray-500">Sube foto o escribe lo que comes sin pesar gramos</p></div>
              <Camera className="w-5 h-5 text-[#800020] shrink-0" />
            </div>

            <div className="grid grid-cols-4 gap-1">
              {['Desayuno', 'Comida Oficina', 'Merienda', 'Cena Casa'].map((slot) => (
                <button key={slot} onClick={() => setMealSlot(slot)} className={`py-1.5 px-1 rounded-xl text-[10px] font-bold border truncate ${mealSlot === slot ? 'bg-[#800020] text-white border-[#800020]' : 'bg-[#F8F9FA] text-gray-600 border-gray-200'}`}>{slot.replace(' Oficina', '').replace(' Casa', '')}</button>
              ))}
            </div>

            <div className="flex items-center gap-2">
              <label className="px-3 py-2.5 rounded-2xl bg-[#FDF2F4] border border-[#F3C6D0] text-[#800020] text-xs font-extrabold flex items-center gap-1.5 cursor-pointer shrink-0">
                <Camera className="w-4 h-4" /> Foto<input type="file" accept="image/*" capture="environment" onChange={handlePhotoUpload} className="hidden" />
              </label>
              <input type="text" placeholder="Ej: Tupper pollo arroz aguacate..." value={mealText} onChange={(e) => setMealText(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') callGeminiVisionNutrition(); }} className="flex-1 bg-[#F8F9FA] border border-gray-300 rounded-2xl px-3 py-2.5 text-xs text-[#111111]" />
              <button onClick={callGeminiVisionNutrition} disabled={estimating || (!photoData && !mealText.trim())} className="px-3.5 py-2.5 rounded-2xl bg-[#800020] disabled:opacity-40 text-white text-xs font-extrabold shrink-0">{estimating ? '...' : 'Calcular'}</button>
            </div>

            {photoData && (
              <div className="flex items-center gap-3 bg-[#F8F9FA] border border-gray-200 rounded-2xl p-2">
                <img src={photoData.previewUrl} alt="Plato" className="w-14 h-14 object-cover rounded-xl shrink-0" />
                <div className="flex-1 min-w-0"><div className="text-xs font-bold text-[#111111]">Foto lista para analizar</div><div className="text-[10px] text-gray-500">Pulsa «Calcular».</div></div>
                <button onClick={() => setPhotoData(null)} className="p-1.5 text-gray-400 hover:text-[#800020]"><X className="w-4 h-4" /></button>
              </div>
            )}

            {estimateErr && <div className="text-[11px] bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-3 py-2">{estimateErr}</div>}

            {pendingEstimate && (
              <div className="bg-[#FDF2F4] border border-[#800020]/35 rounded-2xl p-3 space-y-2.5">
                <div className="flex items-start justify-between gap-2">
                  <div className="flex-1"><span className="text-[10px] font-bold uppercase text-[#800020]">Estimación para {mealSlot}</span><input type="text" value={pendingEstimate.name} onChange={(e) => setPendingEstimate((p) => ({ ...p, name: e.target.value }))} className="w-full bg-white border border-gray-200 rounded-lg px-2 py-1 text-xs font-bold text-[#111111] mt-0.5" /></div>
                  <button onClick={() => setPendingEstimate(null)} className="p-1 text-gray-500"><X className="w-4 h-4" /></button>
                </div>
                {pendingEstimate.ingredientsSummary && <p className="text-[10px] text-gray-700 leading-snug">{pendingEstimate.ingredientsSummary}</p>}
                <div className="flex items-center gap-1.5"><span className="text-[10px] font-bold text-gray-600 mr-1">Ración:</span>{[0.5, 0.75, 1, 1.25, 1.5].map((sc) => <button key={sc} onClick={() => applyPortionScale(sc)} className={`px-2 py-1 rounded-lg text-[10px] font-bold ${portionScale === sc ? 'bg-[#800020] text-white' : 'bg-white border border-gray-200 text-[#111111]'}`}>{sc}×</button>)}</div>
                <div className="grid grid-cols-4 gap-1.5 text-center">
                  <div className="bg-white border border-gray-200 rounded-xl p-1.5"><div className="text-[9px] text-gray-400 font-bold">KCAL</div><input type="number" value={pendingEstimate.kcal} onChange={(e) => setPendingEstimate((p) => ({ ...p, kcal: Number(e.target.value) || 0 }))} className="w-full text-center text-xs font-black text-[#800020]" /></div>
                  <div className="bg-white border border-gray-200 rounded-xl p-1.5"><div className="text-[9px] text-gray-400 font-bold">PROT (g)</div><input type="number" value={pendingEstimate.protein} onChange={(e) => setPendingEstimate((p) => ({ ...p, protein: Number(e.target.value) || 0 }))} className="w-full text-center text-xs font-black text-[#111111]" /></div>
                  <div className="bg-white border border-gray-200 rounded-xl p-1.5"><div className="text-[9px] text-gray-400 font-bold">CARB (g)</div><input type="number" value={pendingEstimate.carbs} onChange={(e) => setPendingEstimate((p) => ({ ...p, carbs: Number(e.target.value) || 0 }))} className="w-full text-center text-xs font-bold text-gray-700" /></div>
                  <div className="bg-white border border-gray-200 rounded-xl p-1.5"><div className="text-[9px] text-gray-400 font-bold">GRAS (g)</div><input type="number" value={pendingEstimate.fat} onChange={(e) => setPendingEstimate((p) => ({ ...p, fat: Number(e.target.value) || 0 }))} className="w-full text-center text-xs font-bold text-gray-700" /></div>
                </div>
                {pendingEstimate.tip && <div className="text-[10px] text-[#800020] font-medium">💡 {pendingEstimate.tip}</div>}
                <button onClick={confirmPendingMeal} className="w-full py-2.5 rounded-xl bg-[#800020] text-white text-xs font-extrabold flex items-center justify-center gap-1.5"><Check className="w-4 h-4" /> Guardar en {mealSlot}</button>
              </div>
            )}

            <div className="pt-2 border-t border-gray-100">
              <div className="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Comidas Registradas ({dayLogs.length})</div>

                      <button onClick={() => onDeleteMealLog(log.id)} className="p-1.5 text-gray-400 hover:text-[#800020]"><Trash2 className="w-4 h-4" /></button>
                    </div>

          <div className="bg-white border border-gray-200 rounded-3xl p-4 shadow-sm space-y-3">
            <div><span className="text-[10px] font-bold uppercase tracking-wider text-[#800020]">Sin complicarte</span><h3 className="text-sm font-bold text-[#111111]">Ideas Reales · Tupper Oficina & Cena en Casa</h3><p className="text-[11px] text-gray-500">Toca «+ Sumar» para añadirlo hoy en 1 toque.</p></div>
            <div className="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">{['Todas', 'Tupper Oficina', 'Cena Casa 10\'', 'Desayunos 3\'', 'Snacks'].map((f) => <button key={f} onClick={() => setIdeaFilter(f)} className={`px-3 py-1.5 rounded-xl text-[11px] font-bold whitespace-nowrap ${ideaFilter === f ? 'bg-[#800020] text-white' : 'bg-[#F8F9FA] border border-gray-200 text-gray-700'}`}>{f}</button>)}</div>
            <div className="space-y-2.5">
              {filteredIdeas.map((idea) => {
                const isOpen = expandedIdeaId === idea.id;
                return (
                  <div key={idea.id} className="bg-[#F8F9FA] border border-gray-200 rounded-2xl p-3">
                    <div className="flex items-start justify-between gap-2">
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-1.5 text-[10px] font-bold text-[#800020] mb-0.5">{idea.slot.includes('Oficina') ? <Briefcase className="w-3 h-3" /> : idea.slot.includes('Cena') ? <Home className="w-3 h-3" /> : <Coffee className="w-3 h-3" />}<span>{idea.slot} · {idea.prepMin} min</span></div>
                        <h4 className="text-xs font-bold text-[#111111] leading-snug">{idea.name}</h4>
                        <div className="text-[11px] font-mono text-gray-600 mt-1"><strong className="text-[#800020]">{idea.kcal} kcal</strong> · P {idea.protein}g · C {idea.carbs}g · G {idea.fat}g</div>
                      </div>
                      <button onClick={() => onAddMealLog({ id: `meal_${Date.now()}_${idea.id}`, date: selectedDate, slot: idea.slot.replace(' 10\'', '').replace(' 3\'', ''), name: idea.name, kcal: idea.kcal, protein: idea.protein, carbs: idea.carbs, fat: idea.fat, source: 'recipe_1tap' })} className="px-2.5 py-2 rounded-xl bg-[#800020] text-white text-[11px] font-extrabold shrink-0 flex items-center gap-1"><Plus className="w-3.5 h-3.5" /> Sumar</button>
                    </div>
                    <button onClick={() => setExpandedIdeaId(isOpen ? null : idea.id)} className="mt-2 text-[10px] font-bold text-gray-600 hover:text-[#800020] flex items-center gap-1">{isOpen ? <ChevronUp className="w-3.5 h-3.5" /> : <ChevronDown className="w-3.5 h-3.5" />}{isOpen ? 'Ocultar ingredientes' : 'Ver ingredientes y truco'}</button>
                    {isOpen && <div className="mt-2 pt-2 border-t border-gray-200 text-[11px] text-gray-700 space-y-1"><div><strong>Ingredientes:</strong> {idea.ingredients}</div><div className="text-[#800020]"><strong>Truco:</strong> {idea.tip}</div></div>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    /* ============================================================================
     * 10. ERROR BOUNDARY + APLICACIÓN PRINCIPAL (App)
     * ========================================================================== */
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMsg: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMsg: String(error?.message || error) };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#F7F7F8] flex items-center justify-center p-6 text-center">
              <div className="max-w-sm bg-white border border-gray-200 rounded-3xl p-6 space-y-3 shadow-sm">
                <AlertTriangle className="w-8 h-8 text-[#800020] mx-auto" />
                <h2 className="text-base font-bold text-[#111111]">Se produjo un error inesperado</h2>
                <p className="text-xs text-gray-600">{this.state.errorMsg}</p>
                <button onClick={() => window.location.reload()} className="w-full py-2.5 rounded-xl bg-[#800020] text-white text-xs font-bold">Recargar HybridOS</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      const embeddedInitial = useMemo(() => readEmbeddedState(), []);

      const [activeTab, setActiveTab] = useState('status');
      const [user, setUser] = useState(null);
      const [fbHandles, setFbHandles] = useState({ auth: null, db: null });
      const [syncStatus, setSyncStatus] = useState('Guardado en dispositivo');
      const [idbReady, setIdbReady] = useState(false);

      const [athleteSex, setAthleteSex] = useState(embeddedInitial?.athleteSex || 'M');
      const [athleteAge, setAthleteAge] = useState(embeddedInitial?.athleteAge || 36);
      const [nutritionGoal, setNutritionGoal] = useState(embeddedInitial?.nutritionGoal || 'recomp');
      const [activityLevel, setActivityLevel] = useState(embeddedInitial?.activityLevel || 'office');
      const [nutritionLogs, setNutritionLogs] = useState(embeddedInitial?.nutritionLogs || []);
      const [bodyCheckins, setBodyCheckins] = useState(() => embeddedInitial?.bodyCheckins?.length ? embeddedInitial.bodyCheckins : createInitialBodyCheckins());
      const [customRoutines, setCustomRoutines] = useState(embeddedInitial?.customRoutines || []);
      const [completedSessions, setCompletedSessions] = useState(() => embeddedInitial?.completedSessions || createInitialSessions());
      const [scheduledWorkouts, setScheduledWorkouts] = useState(() => embeddedInitial?.scheduledWorkouts || createInitialScheduled());
      const [currentBlockId, setCurrentBlockId] = useState(embeddedInitial?.currentBlockId || 1);
      const [blockWeek, setBlockWeek] = useState(embeddedInitial?.blockWeek || 3);
      const [deloadActive, setDeloadActive] = useState(Boolean(embeddedInitial?.deloadActive));
      const [schedulePrefs, setSchedulePrefs] = useState(embeddedInitial?.schedulePrefs || { trainingWeekdays: [1, 2, 4, 5], includeSundayFlex: true });
      const [customGeminiKey, setCustomGeminiKey] = useState(embeddedInitial?.customGeminiKey || '');
      const [customFirebaseJson, setCustomFirebaseJson] = useState(embeddedInitial?.customFirebaseJson || '');

      const [inspectedExercise, setInspectedExercise] = useState(null);
      const [previewRoutine, setPreviewRoutine] = useState(null);
      const [routineModalState, setRoutineModalState] = useState({ open: false, initial: null, isEditing: false });
      const [showCoachModal, setShowCoachModal] = useState(false);
      const [showInstallModal, setShowInstallModal] = useState(false);
      const [externalModalDate, setExternalModalDate] = useState(null);
      const [activeWorkout, setActiveWorkout] = useState(null);
      const [notifPermission, setNotifPermission] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'unsupported');
      const [appToast, setAppToast] = useState('');

      const allRoutines = useMemo(() => [...customRoutines, ...ROUTINES_DB], [customRoutines]);
      const trainingReview = useMemo(() => buildTrainingReview(completedSessions, bodyCheckins, allRoutines, athleteSex, currentBlockId, blockWeek, deloadActive, scheduledWorkouts), [completedSessions, bodyCheckins, allRoutines, athleteSex, currentBlockId, blockWeek, deloadActive, scheduledWorkouts]);

      const showToast = (msg) => { setAppToast(msg); setTimeout(() => setAppToast(''), 3800); };

      const buildFullSnapshot = (patch = {}) => ({
        athleteSex, athleteAge, nutritionGoal, activityLevel, nutritionLogs, bodyCheckins, customRoutines, completedSessions, scheduledWorkouts, currentBlockId, blockWeek, deloadActive, schedulePrefs, customGeminiKey, customFirebaseJson,
        updatedAt: new Date().toISOString(),
        ...patch
      });

      const hydrateFromData = (data) => {
        if (!data || typeof data !== 'object') return;
        if (data.athleteSex) setAthleteSex(data.athleteSex);
        if (data.athleteAge) setAthleteAge(data.athleteAge);
        if (data.nutritionGoal) setNutritionGoal(data.nutritionGoal);
        if (data.activityLevel) setActivityLevel(data.activityLevel);
        if (Array.isArray(data.nutritionLogs)) setNutritionLogs(data.nutritionLogs);
        if (Array.isArray(data.bodyCheckins) && data.bodyCheckins.length > 0) setBodyCheckins(data.bodyCheckins);
        if (Array.isArray(data.customRoutines)) setCustomRoutines(data.customRoutines);
        if (Array.isArray(data.completedSessions)) setCompletedSessions(data.completedSessions);
        if (Array.isArray(data.scheduledWorkouts)) {
          const validIds = new Set([...(data.customRoutines || []), ...ROUTINES_DB].map((r) => r.id));
          setScheduledWorkouts(data.scheduledWorkouts.filter((s) => validIds.has(s.routineId)));
        }
        if (data.currentBlockId) setCurrentBlockId(data.currentBlockId);
        if (data.blockWeek) setBlockWeek(data.blockWeek);
        if (typeof data.deloadActive === 'boolean') setDeloadActive(data.deloadActive);
        if (data.schedulePrefs?.trainingWeekdays) setSchedulePrefs(data.schedulePrefs);
        if (typeof data.customGeminiKey === 'string') setCustomGeminiKey(data.customGeminiKey);
        if (typeof data.customFirebaseJson === 'string') setCustomFirebaseJson(data.customFirebaseJson);
      };

      // 1) Hidratación inmediata desde IndexedDB (permanece al recargar o actualizar archivo en iPhone)
      useEffect(() => {
        let mounted = true;
        idbReadState().then((saved) => {
          if (!mounted) return;
          if (saved) {
            hydrateFromData(saved);
            setSyncStatus('Guardado en iPhone (IndexedDB)');
          } else if (embeddedInitial) {
            idbWriteState(embeddedInitial);
            setSyncStatus('Datos importados al iPhone');
          }
          setIdbReady(true);
        });
        return () => { mounted = false; };
      }, []);

      // 2) Conexión opcional a Firebase Firestore (entorno colaborativo o config propia del usuario)
      useEffect(() => {
        const tryInitFirebase = () => {
          try {
            const fb = window.__HybridFirebase;
            if (!fb) return;
            const rawCfg = typeof __firebase_config !== 'undefined' && __firebase_config ? __firebase_config : customFirebaseJson;
            if (!rawCfg) return;
            const cfg = JSON.parse(rawCfg);
            const appInst = fb.initializeApp(cfg, 'hybridos_app');
            const authInst = fb.getAuth(appInst);
            const dbInst = fb.getFirestore(appInst);
            setFbHandles({ auth: authInst, db: dbInst });

            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await fb.signInWithCustomToken(authInst, __initial_auth_token);
                } else {
                  await fb.signInAnonymously(authInst);
                }
              } catch (e) {
                console.warn('Auth Firebase fallback local:', e);
              }
            };
            initAuth();
            fb.onAuthStateChanged(authInst, (u) => {
              setUser(u);
              if (u) setSyncStatus('iPhone + Nube Activa');
            });
          } catch (err) {
            console.warn('Firebase no inicializado:', err);
          }
        };

        tryInitFirebase();
        window.addEventListener('hybrid-firebase-ready', tryInitFirebase);
        return () => window.removeEventListener('hybrid-firebase-ready', tryInitFirebase);
      }, [customFirebaseJson]);

      // 3) Suscripción en tiempo real a Firestore (solo tras autenticar y siguiendo ruta estricta)
      useEffect(() => {
        const fb = window.__HybridFirebase;
        if (!fb || !fbHandles.db || !user) return undefined;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hybridos-v3-app';
        const userDocRef = fb.doc(fbHandles.db, 'artifacts', appId, 'users', user.uid, 'hybridos_state', 'profile_v3');
        const unsub = fb.onSnapshot(
          userDocRef,
          (snap) => {
            if (snap.exists()) {
              const data = snap.data();
              hydrateFromData(data);
              idbWriteState(data);
            }
            setSyncStatus('Sincronizado (Nube + iPhone)');
          },
          (err) => {
            console.warn('Error lectura Firestore:', err);
            setSyncStatus('Guardado en iPhone (IndexedDB)');
          }
        );
        return () => unsub();
      }, [fbHandles.db, user]);

      // Guardado unificado en IndexedDB + Firestore (sin usar localStorage)
      const persistState = async (patch = {}) => {
        const snapshot = buildFullSnapshot(patch);
        await idbWriteState(snapshot);
        const fb = window.__HybridFirebase;
        if (fb && fbHandles.db && user) {
          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'hybridos-v3-app';
            const userDocRef = fb.doc(fbHandles.db, 'artifacts', appId, 'users', user.uid, 'hybridos_state', 'profile_v3');
            await fb.setDoc(userDocRef, snapshot);
          } catch (err) {
            console.warn('Error guardando Firestore (guardado en IndexedDB):', err);
          }
        }
      };

      const handleRequestNotif = async () => {
        try {
          if (typeof Notification === 'undefined') { showToast('Usa "Alerta iPhone (.ics)" para recordatorios en iOS.'); return; }
          const res = await Notification.requestPermission();
          setNotifPermission(res);
          if (res === 'granted') new Notification('HybridOS — Recordatorio Dominical', { body: 'Cada domingo te recordaremos tus medidas corporales.' });
        } catch (e) {
          showToast('Descarga el archivo .ics para activar el recordatorio semanal en iPhone.');
        }
      };

      const handleRegeneratePlan = (overrides = {}) => {
        const nextPrefs = overrides.schedulePrefs || schedulePrefs;
        const nextCheckins = overrides.bodyCheckins || bodyCheckins;
        const nextCompleted = overrides.completedSessions || completedSessions;
        const nextBlock = overrides.currentBlockId || currentBlockId;
        const nextDeload = typeof overrides.deloadActive === 'boolean' ? overrides.deloadActive : deloadActive;
        const startFrom = overrides.startISO || TODAY_ISO;

        const keepExisting = scheduledWorkouts.filter((s) => s.date < startFrom);
        const freshPlan = generateAdaptiveMesocycle({ startISO: startFrom, weeks: 4, schedulePrefs: nextPrefs, completedSessions: nextCompleted, bodyCheckins: nextCheckins, allRoutines, athleteSex, currentBlockId: nextBlock, blockWeek, deloadActive: nextDeload, scheduledWorkouts });
        const combined = [...keepExisting, ...freshPlan];
        setScheduledWorkouts(combined);
        persistState({ scheduledWorkouts: combined, ...(overrides.schedulePrefs ? { schedulePrefs: nextPrefs } : {}), ...(overrides.bodyCheckins ? { bodyCheckins: nextCheckins } : {}), ...(overrides.completedSessions ? { completedSessions: nextCompleted } : {}) });
        if (!overrides.silent) showToast('Calendario de 4 semanas reenfocado.');
      };

      const handleSaveCheckin = (entry) => {
        const nextCheckins = [entry, ...bodyCheckins.filter((c) => c.date !== entry.date)];
        setBodyCheckins(nextCheckins);
        handleRegeneratePlan({ bodyCheckins: nextCheckins, startISO: addDaysISO(TODAY_ISO, 1), silent: true });
        showToast('Medidas guardadas en tu dispositivo.');
      };

      const handleDeleteCheckin = (id) => {
        const next = bodyCheckins.filter((c) => c.id !== id);
        setBodyCheckins(next); persistState({ bodyCheckins: next });
      };

      const handleScheduleRoutine = (routineId, dateISO) => {
        const next = [...scheduledWorkouts, { id: `sch_${Date.now()}`, date: dateISO, routineId, status: 'pending' }];
        setScheduledWorkouts(next); persistState({ scheduledWorkouts: next });
        showToast(`Rutina programada para ${formatHumanDate(dateISO)}`);
      };

      const handleRemoveScheduled = (schId) => {
        const next = scheduledWorkouts.filter((s) => s.id !== schId);
        setScheduledWorkouts(next); persistState({ scheduledWorkouts: next });
      };

      const handleMarkIncomplete = (schId) => {
        const next = scheduledWorkouts.map((s) => (s.id === schId ? { ...s, status: 'incomplete' } : s));
        setScheduledWorkouts(next); persistState({ scheduledWorkouts: next });
        showToast('Sesión marcada como no completada.');
      };

      const handleReactivateScheduled = (schId) => {
        const next = scheduledWorkouts.map((s) => (s.id === schId ? { ...s, status: 'pending' } : s));
        setScheduledWorkouts(next); persistState({ scheduledWorkouts: next });
        showToast('Sesión reactivada como pendiente.');
      };

      const handleMoveToTomorrow = (schId, fromDate) => {
        const nextDate = addDaysISO(fromDate || TODAY_ISO, 1);
        const next = scheduledWorkouts.map((s) => (s.id === schId ? { ...s, date: nextDate, status: 'pending', phaseNote: 'Reprogramada desde día no completado' } : s));
        setScheduledWorkouts(next); persistState({ scheduledWorkouts: next });
        showToast(`Movida a ${formatHumanDate(nextDate)}.`);
      };

      const handleStartRoutine = (routine, dateISO = TODAY_ISO, scheduledId = null) => {
        setPreviewRoutine(null); setActiveWorkout({ routine, dateISO, scheduledId });
      };

      const handleCompleteSession = (sessionObj) => {
        const nextCompleted = [sessionObj, ...completedSessions];
        let nextScheduled = activeWorkout?.scheduledId ? scheduledWorkouts.filter((s) => s.id !== activeWorkout.scheduledId) : scheduledWorkouts;
        let autoAdjustMsg = '¡Sesión guardada! Pilares actualizados.';
        const tomorrowISO = addDaysISO(sessionObj.date || TODAY_ISO, 1);
        const tomorrowItem = nextScheduled.find((s) => s.date === tomorrowISO && s.status === 'pending');
        if (tomorrowItem) {
          if (sessionObj.shoulderFatigue >= 4 && ['torso_a', 'torso_b', 'empuje_fuerza', 'fuerza_5x5'].includes(tomorrowItem.routineId)) {
            const swapId = sessionObj.kneeFatigue >= 3 ? 'flexibilidad_cadera_post' : 'pierna_a';
            nextScheduled = nextScheduled.map((s) => (s.id === tomorrowItem.id ? { ...s, routineId: swapId, phaseNote: 'Auto-ajustado por fatiga de hombro' } : s));
            autoAdjustMsg = 'Guardado · Fatiga hombro detectada: mañana adaptado.';
          } else if (sessionObj.kneeFatigue >= 4 && ['pierna_a', 'pierna_b', 'recomp_metabolica_hibrida', 'explosividad_potencia_total'].includes(tomorrowItem.routineId)) {
            nextScheduled = nextScheduled.map((s) => (s.id === tomorrowItem.id ? { ...s, routineId: 'movilidad_hombro_pre_torso', phaseNote: 'Auto-ajustado por fatiga de rodilla' } : s));
            autoAdjustMsg = 'Guardado · Fatiga rodilla detectada: mañana adaptado.';
          }
        }
        setCompletedSessions(nextCompleted); setScheduledWorkouts(nextScheduled); setActiveWorkout(null);
        persistState({ completedSessions: nextCompleted, scheduledWorkouts: nextScheduled });
        showToast(autoAdjustMsg);
      };

      const handleApplyGeminiPlan = (plan) => {
        let nextCustomRoutines = customRoutines;
        let createdRoutineId = null;
        if (plan?.newCustomRoutine?.create && plan.newCustomRoutine.exerciseIds?.length > 0) {
          const validIds = plan.newCustomRoutine.exerciseIds.filter((eid) => EXERCISES_DB.some((e) => e.id === eid));
          if (validIds.length > 0) {
            createdRoutineId = `custom_ai_${Date.now()}`;
            nextCustomRoutines = [{
              id: createdRoutineId, name: plan.newCustomRoutine.name || 'Rutina Coach Gemini',
              category: ROUTINE_CATEGORIES.includes(plan.newCustomRoutine.category) ? plan.newCustomRoutine.category : 'Composición & Simetría',
              discipline: ['strength', 'agility', 'mobility'].includes(plan.newCustomRoutine.discipline) ? plan.newCustomRoutine.discipline : 'strength',
              estimatedMin: Math.max(25, validIds.length * 8), level: 'Adaptada IA', description: plan.newCustomRoutine.description || 'Rutina diseñada por Coach Gemini IA.',
              exercises: validIds.map((id) => { const ex = getExerciseById(id); return { exerciseId: id, sets: 3, minReps: ex.unit === 'seg' ? 40 : 8, maxReps: ex.unit === 'seg' ? 45 : 12, targetRir: 2, restSec: ex.defaultRest || 90 }; })
            }, ...customRoutines];
            setCustomRoutines(nextCustomRoutines);
          }
        }
        const updatedPool = [...nextCustomRoutines, ...ROUTINES_DB];
        let nextScheduled = scheduledWorkouts.slice();
        if (Array.isArray(plan?.scheduleUpdates) && plan.scheduleUpdates.length > 0) {
          plan.scheduleUpdates.forEach((upd, idx) => {
            if (!upd?.date || !/^\d{4}-\d{2}-\d{2}$/.test(upd.date)) return;
            const validRoutine = updatedPool.find((r) => r.id === upd.routineId);
            const finalId = validRoutine ? validRoutine.id : createdRoutineId;
            if (!finalId) return;
            nextScheduled = nextScheduled.filter((s) => !(s.date === upd.date && s.status === 'pending'));
            nextScheduled.push({ id: `sch_ai_${upd.date}_${idx}_${Date.now()}`, date: upd.date, routineId: finalId, status: 'pending', phaseNote: `Gemini IA: ${upd.reason || 'Ajuste'}` });
          });
          setScheduledWorkouts(nextScheduled);
        }
        const nextBlock = plan.recommendedBlockId >= 1 && plan.recommendedBlockId <= 4 ? plan.recommendedBlockId : currentBlockId;
        const nextDeload = typeof plan.activateDeload === 'boolean' ? plan.activateDeload : deloadActive;
        setCurrentBlockId(nextBlock); setDeloadActive(nextDeload);
        persistState({ customRoutines: nextCustomRoutines, scheduledWorkouts: nextScheduled, currentBlockId: nextBlock, deloadActive: nextDeload });
        showToast('Cambios de Gemini IA aplicados.');
      };

      const handleCopyGeminiSnapshot = async () => {
        const text = buildGeminiSnapshotText({ athleteSex, athleteAge, nutritionGoal, activityLevel, nutritionLogs, bodyCheckins, completedSessions, scheduledWorkouts, allRoutines, currentBlockId, blockWeek, deloadActive, schedulePrefs });
        const ok = await copyTextSafe(text);
        showToast(ok ? 'Resumen copiado al portapapeles.' : 'Usa Exportar JSON para guardar copia.');
      };

      const handleSaveCustomRoutine = (routineObj, isEditingExisting) => {
        const next = isEditingExisting
          ? customRoutines.map((r) => (r.id === routineObj.id ? routineObj : r))
          : [routineObj, ...customRoutines];
        setCustomRoutines(next);
        persistState({ customRoutines: next });
        showToast(isEditingExisting ? 'Rutina actualizada.' : 'Rutina personalizada guardada.');
      };

      const handleDeleteCustomRoutine = (id) => {
        const next = customRoutines.filter((r) => r.id !== id);
        setCustomRoutines(next);
        persistState({ customRoutines: next });
        showToast('Rutina personalizada eliminada.');
      };

      const handleExportJSON = () => {
        const payload = buildFullSnapshot();
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `HybridOS-Respaldo-${TODAY_ISO}.json`; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('Copia .json descargada.');
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0]; e.target.value = ''; if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(String(reader.result));
            hydrateFromData(data);
            persistState(data);
            showToast('Respaldo importado y guardado en tu dispositivo.');
          } catch (err) {
            showToast('Archivo JSON no válido.');
          }
        };
        reader.readAsText(file);
      };

      const handleDownloadHtml = (filename) => {
        const ok = downloadStandaloneHtml(filename, buildFullSnapshot());
        showToast(ok ? `Descargado ${filename} con todos tus datos.` : 'No se pudo generar la descarga.');
      };

      const handleAddMealLog = (mealEntry) => {
        const next = [mealEntry, ...nutritionLogs];
        setNutritionLogs(next); persistState({ nutritionLogs: next });
        showToast(`Añadido: ${mealEntry.name} (+${mealEntry.kcal} kcal)`);
      };

      const handleDeleteMealLog = (mealId) => {
        const next = nutritionLogs.filter((l) => l.id !== mealId);
        setNutritionLogs(next); persistState({ nutritionLogs: next });
      };

      const sundayPending = isSundayISO(TODAY_ISO) && !bodyCheckins.some((c) => c.date === TODAY_ISO);
      const sortedCheckins = useMemo(() => bodyCheckins.slice().sort((a, b) => b.date.localeCompare(a.date)), [bodyCheckins]);
      const latestMeasure = sortedCheckins[0];
      const firstMeasure = sortedCheckins[sortedCheckins.length - 1];

      if (activeWorkout) {
        return (
          <>
            <ActiveWorkoutView routine={activeWorkout.routine} dateISO={activeWorkout.dateISO} completedSessions={completedSessions} deloadActive={deloadActive} onInspectExercise={setInspectedExercise} onCompleteSession={handleCompleteSession} onCancel={() => setActiveWorkout(null)} />
            <ExerciseDetailModal exercise={inspectedExercise} onClose={() => setInspectedExercise(null)} />
          </>
        );
      }

      return (
        <div className="min-h-screen bg-[#F7F7F8] text-[#111111] font-sans overflow-x-hidden">
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-200 safe-pt">
            <div className="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-xl bg-[#800020] text-white flex items-center justify-center font-black text-sm shadow-sm">H</div>
                <div>
                  <h1 className="text-sm font-black tracking-tight text-[#111111] leading-none">HybridOS</h1>
                  <p className="text-[10px] text-gray-500 mt-0.5">{idbReady ? 'Memoria Activa' : 'Cargando...'}</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button onClick={() => setShowInstallModal(true)} className="px-2.5 py-1.5 rounded-xl bg-[#111111] text-white text-[10px] font-bold flex items-center gap-1" title="Descargar App iPhone 13">
                  <Download className="w-3.5 h-3.5" /> App
                </button>
                <button onClick={() => setShowCoachModal(true)} className="px-2.5 py-1.5 rounded-xl bg-[#FDF2F4] border border-[#F3C6D0] text-[#800020] text-[10px] font-bold flex items-center gap-1">
                  <Sparkles className="w-3.5 h-3.5 text-[#800020]" /> IA
                </button>
                <button onClick={() => setActiveTab('status')} className={`px-2 py-1.5 rounded-xl text-[10px] font-bold flex items-center gap-1 border ${sundayPending ? 'bg-[#800020] border-[#800020] text-white' : 'bg-gray-100 border-gray-200 text-[#111111]'}`}>
                  <Scale className="w-3.5 h-3.5" />{sundayPending ? 'Dom!' : `${latestMeasure?.weight || 79}kg`}
                </button>
              </div>
            </div>
          </header>

          {appToast && <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-sm bg-[#111111] border border-[#800020] text-white text-xs font-semibold px-4 py-2.5 rounded-2xl shadow-xl text-center">{appToast}</div>}

          <main className="max-w-md mx-auto px-4 pt-4 pb-24">
            {activeTab === 'calendar' && (
              <CalendarTab allRoutines={allRoutines} completedSessions={completedSessions} scheduledWorkouts={scheduledWorkouts} bodyCheckins={bodyCheckins} onStartRoutine={handleStartRoutine} onPreviewRoutine={setPreviewRoutine} onScheduleRoutine={handleScheduleRoutine} onRemoveScheduled={handleRemoveScheduled} onMarkIncomplete={handleMarkIncomplete} onReactivateScheduled={handleReactivateScheduled} onMoveToTomorrow={handleMoveToTomorrow} onOpenExternalModal={(d) => setExternalModalDate(d || TODAY_ISO)} onGoToStatus={() => setActiveTab('status')} schedulePrefs={schedulePrefs} onUpdateSchedulePrefs={(next) => { setSchedulePrefs(next); persistState({ schedulePrefs: next }); }} onRegeneratePlan={() => handleRegeneratePlan()} trainingReview={trainingReview} onOpenCoach={() => setShowCoachModal(true)} />
            )}
            {activeTab === 'status' && (
              <StatusTab bodyCheckins={bodyCheckins} athleteSex={athleteSex} onToggleSex={(sx) => { setAthleteSex(sx); persistState({ athleteSex: sx }); }} onSaveCheckin={handleSaveCheckin} onDeleteCheckin={handleDeleteCheckin} completedSessions={completedSessions} allRoutines={allRoutines} onSelectRoutine={setPreviewRoutine} notifPermission={notifPermission} onRequestNotif={handleRequestNotif} />
            )}
            {activeTab === 'nutrition' && (
              <NutritionTab athleteSex={athleteSex} athleteAge={athleteAge} onChangeAge={(age) => { setAthleteAge(age); persistState({ athleteAge: age }); }} nutritionGoal={nutritionGoal} onChangeGoal={(g) => { setNutritionGoal(g); persistState({ nutritionGoal: g }); }} activityLevel={activityLevel} onChangeActivity={(act) => { setActivityLevel(act); persistState({ activityLevel: act }); }} bodyCheckins={bodyCheckins} completedSessions={completedSessions} scheduledWorkouts={scheduledWorkouts} allRoutines={allRoutines} nutritionLogs={nutritionLogs} customGeminiKey={customGeminiKey} onAddMealLog={handleAddMealLog} onDeleteMealLog={handleDeleteMealLog} />
            )}
            {activeTab === 'routines' && (
              <RoutinesTab allRoutines={allRoutines} onPreviewRoutine={setPreviewRoutine} onStartRoutine={handleStartRoutine} onOpenCreate={() => setRoutineModalState({ open: true, initial: null, isEditing: false })} />
            )}
            {activeTab === 'exercises' && <ExercisesTab onInspectExercise={setInspectedExercise} />}
            {activeTab === 'plan' && (
              <PlanTab currentBlockId={currentBlockId} blockWeek={blockWeek} deloadActive={deloadActive} onChangeBlock={(id) => { setCurrentBlockId(id); setBlockWeek(1); handleRegeneratePlan({ currentBlockId: id, silent: true }); persistState({ currentBlockId: id, blockWeek: 1 }); }} onChangeWeek={(w) => { setBlockWeek(w); persistState({ blockWeek: w }); }} onToggleDeload={() => { const nd = !deloadActive; setDeloadActive(nd); handleRegeneratePlan({ deloadActive: nd, silent: true }); persistState({ deloadActive: nd }); }} completedSessions={completedSessions} latestMeasure={latestMeasure} firstMeasure={firstMeasure} allRoutines={allRoutines} onPreviewRoutine={setPreviewRoutine} onOpenExternalModal={(d) => setExternalModalDate(d || TODAY_ISO)} syncStatus={syncStatus} userId={user?.uid} onExportJSON={handleExportJSON} onImportJSON={handleImportJSON} trainingReview={trainingReview} onOpenCoach={() => setShowCoachModal(true)} onCopyGeminiSnapshot={handleCopyGeminiSnapshot} onRegeneratePlan={() => handleRegeneratePlan()} onOpenInstallModal={() => setShowInstallModal(true)} />
            )}
          </main>

          <nav className="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-lg border-t border-gray-200 safe-pb">
            <div className="max-w-md mx-auto grid grid-cols-6 px-0.5 py-1.5">
              {[
                { id: 'calendar', label: 'Agenda', icon: Calendar },
                { id: 'status', label: 'Estado', icon: Scale, badge: sundayPending },
                { id: 'nutrition', label: 'Dieta', icon: Utensils },
                { id: 'routines', label: 'Rutinas', icon: Layers },
                { id: 'exercises', label: 'Ejerc.', icon: Dumbbell },
                { id: 'plan', label: 'Plan', icon: TrendingUp }
              ].map((tab) => {
                const Icon = tab.icon; const active = activeTab === tab.id;
                return (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`relative flex flex-col items-center justify-center py-1.5 rounded-2xl transition ${active ? 'text-[#800020]' : 'text-gray-400 hover:text-[#111111]'}`}>
                    <div className="relative"><Icon className="w-5 h-5" />{tab.badge && <span className="w-2 h-2 rounded-full bg-[#800020] absolute -top-0.5 -right-1 animate-ping" />}{tab.badge && <span className="w-2 h-2 rounded-full bg-[#800020] absolute -top-0.5 -right-1" />}</div>
                    <span className="text-[9.5px] font-bold mt-0.5 truncate max-w-full">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>

          <RoutinePreviewModal
            routine={previewRoutine}
            isCustom={Boolean(previewRoutine && customRoutines.some((c) => c.id === previewRoutine.id))}
            onClose={() => setPreviewRoutine(null)}
            onStartWorkout={(r) => handleStartRoutine(r, TODAY_ISO)}
            onScheduleDate={handleScheduleRoutine}
            onInspectExercise={setInspectedExercise}
            onEditOrClone={(r) => {
              const isCust = customRoutines.some((c) => c.id === r.id);
              setPreviewRoutine(null);
              setRoutineModalState({ open: true, initial: r, isEditing: isCust });
            }}
            onDeleteCustom={handleDeleteCustomRoutine}
          />

          <ExerciseDetailModal exercise={inspectedExercise} onClose={() => setInspectedExercise(null)} />

          {routineModalState.open && (
            <CreateRoutineModal
              initialRoutine={routineModalState.initial}
              isEditingExistingCustom={routineModalState.isEditing}
              onClose={() => setRoutineModalState({ open: false, initial: null, isEditing: false })}
              onSave={handleSaveCustomRoutine}
            />
          )}

          {externalModalDate && <ExternalActivityModal defaultDate={externalModalDate} onClose={() => setExternalModalDate(null)} onSave={handleCompleteSession} />}

          {showCoachModal && (
            <GeminiCoachModal onClose={() => setShowCoachModal(false)} athleteSex={athleteSex} athleteAge={athleteAge} nutritionGoal={nutritionGoal} activityLevel={activityLevel} nutritionLogs={nutritionLogs} bodyCheckins={bodyCheckins} completedSessions={completedSessions} scheduledWorkouts={scheduledWorkouts} allRoutines={allRoutines} currentBlockId={currentBlockId} blockWeek={blockWeek} deloadActive={deloadActive} schedulePrefs={schedulePrefs} customGeminiKey={customGeminiKey} onApplyPlan={handleApplyGeminiPlan} onCopySnapshot={handleCopyGeminiSnapshot} />
          )}

          {showInstallModal && (
            <IPhoneInstallModal
              onClose={() => setShowInstallModal(false)}
              onDownloadHtml={handleDownloadHtml}
              onExportJSON={handleExportJSON}
              onImportJSON={handleImportJSON}
              customGeminiKey={customGeminiKey}
              onSaveGeminiKey={(k) => { setCustomGeminiKey(k); persistState({ customGeminiKey: k }); showToast('API Key Gemini guardada en tu dispositivo.'); }}
              customFirebaseJson={customFirebaseJson}
              onSaveFirebaseJson={(cfg) => { setCustomFirebaseJson(cfg); persistState({ customFirebaseJson: cfg }); showToast('Configuración Firebase guardada.'); }}
              syncStatus={syncStatus}
            />
          )}
        </div>
      );
    }

    const rootContainer = document.getElementById('root');
    if (rootContainer) {
      ReactDOM.createRoot(rootContainer).render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    }
  </script>
